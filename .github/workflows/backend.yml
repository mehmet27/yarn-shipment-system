name: backend

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "frontend/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "frontend/**"
      - "**/*.md"

# Aynı PR'a yeni commit gelince eski koşu iptal edilir.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Maven Wrapper dağıtımı her koşuda Maven Central'dan indirilmesin: indirme arada bir başarısız olup koşuyu düşürüyor.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # BUILD-08: biçim → derleme (Error Prone, NullAway) → Checkstyle → birim + ArchUnit → PMD → JaCoCo
      - name: Biçim denetimi (Spotless)
        run: ./mvnw -B -ntp spotless:check
      - name: Derleme, statik analiz ve testler
        run: ./mvnw -B -ntp verify
