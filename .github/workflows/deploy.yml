name: deploy

# Sunucu kurulumu (deploy/prod) ve betikler: kabuk betikleri denetlenir, üretim imajları derlenir ve
# kurulum → giriş → yedek → güncelleme → her şeyi sil → geri yükleme zinciri uçtan uca denenir
# (tools/ci/deploy-smoke.sh). Haftalık koşu, temel imajlardaki değişikliklerin kurulumu bozmasını yakalar.
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'tools/ci/deploy-smoke.sh'
      - 'tools/db/**'
      - '.dockerignore'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'tools/ci/deploy-smoke.sh'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  schedule:
    # Her pazartesi 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  betikler:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kabuk betikleri (shellcheck)
        # SC2119/SC2120: initdb betiğindeki run_sql bilinçli olarak argümansız çağrılır.
        run: shellcheck -x -e SC2119,SC2120 deploy/prod/*.sh deploy/*.sh deploy/postgres/initdb/*.sh tools/ci/*.sh tools/db/*.sh
      - name: İş akışı dosyaları (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Compose dosyaları geçerli mi
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --quiet
          sed 's/^\(POSTGRES_PASSWORD\|DB_PASSWORD\|INITIAL_ADMIN_PASSWORD\|EVIDENCE_STORAGE_SIGNING_KEY\)=$/\1=ci/' deploy/prod/.env.example > /tmp/prod.env
          docker compose -f deploy/prod/docker-compose.yml --env-file /tmp/prod.env config --quiet
          rm deploy/.env

  kurulum:
    # Yalnızca kurulumu etkileyen değişikliklerde, haftalık koşuda ve elle başlatıldığında (imaj derlemesi uzun sürer).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum, yedek ve geri yükleme (uçtan uca)
        run: sudo tools/ci/deploy-smoke.sh
