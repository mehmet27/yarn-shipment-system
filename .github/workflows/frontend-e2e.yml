name: frontend-e2e

# FE-TEST-08: uçtan uca testler her PR'da ve main'e birleşmede koşar; elle de başlatılabilir.
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-e2e.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-e2e.yml']
  workflow_dispatch:

# Aynı PR'a yeni commit gelince eski koşu iptal edilir.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  e2e:
    # Playwright 1.55 ubuntu-latest'in (26.04) tarayıcı bağımlılıklarını kuramıyor; sürüm sabit.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iplik/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-rapor
          path: frontend/apps/web/e2e/rapor
          retention-days: 14
