name: frontend

on:
  pull_request:
    paths: ['frontend/**', 'services/shipment-service/src/main/resources/openapi/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'services/shipment-service/src/main/resources/openapi/**', '.github/workflows/frontend.yml']

# Aynı PR'a yeni commit gelince eski koşu iptal edilir.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    # Sürüm sabit: ubuntu-latest değişince CI kendiliğinden bozulmasın (frontend-e2e ile aynı).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # FE-BUILD-05: sıra kod standartlarıyla aynı
      - run: pnpm install --frozen-lockfile
      # FE-MOD-06: üretilmiş istemci OpenAPI ile senkron olmalı
      - run: pnpm --filter @iplik/api-client api:generate && git diff --exit-code -- packages/api-client/src/generated
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      - run: pnpm build
