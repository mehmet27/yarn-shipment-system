name: frontend

on:
  pull_request:
    paths: ['frontend/**', 'services/shipment-service/src/main/resources/openapi/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'services/shipment-service/src/main/resources/openapi/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # FE-BUILD-05: sıra kod standartlarıyla aynı
      - run: pnpm install --frozen-lockfile
      # FE-MOD-06: üretilmiş istemci OpenAPI ile senkron olmalı
      - run: pnpm --filter @iplik/api-client api:generate && git diff --exit-code -- packages/api-client/src/generated
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      - run: pnpm build
