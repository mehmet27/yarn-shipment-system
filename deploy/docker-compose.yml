# Yerel geliştirme ortamı (veritabanı tasarımı, "Yerel geliştirme").
# Kullanım: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml up -d
# Kanıt dosyaları Docker'da değil, uygulamanın EVIDENCE_STORAGE_ROOT klasöründe tutulur (varsayılan ./data/evidence).
name: yarn-shipment

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env içinde POSTGRES_PASSWORD tanımlayın}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?deploy/.env içinde LOCAL_DB_PASSWORD tanımlayın}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
