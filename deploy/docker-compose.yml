# Yerel geliştirme ortamı (veritabanı tasarımı, "Yerel geliştirme").
# Kullanım: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml up -d
# Kafka ve MinIO sonraki adımlarda eklenecek. Keycloak `yarnshipment` realm'i deploy/keycloak altından açılışta içe aktarılır.
name: yarn-shipment

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env içinde POSTGRES_PASSWORD tanımlayın}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?deploy/.env içinde LOCAL_DB_PASSWORD tanımlayın}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # Gateway oturumları; şifre ortamdan verilir, veri kalıcı değildir (yeniden başlayınca oturumlar düşer).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?deploy/.env içinde REDIS_PASSWORD tanımlayın}", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--http-port=8180", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${LOCAL_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?deploy/.env içinde KEYCLOAK_ADMIN_PASSWORD tanımlayın}
      # Realm dosyasındaki ${...} yer tutucuları Keycloak tarafından bu ortam değişkenlerinden doldurulur.
      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD:?deploy/.env içinde KEYCLOAK_TEST_USER_PASSWORD tanımlayın}
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?deploy/.env içinde GATEWAY_CLIENT_SECRET tanımlayın}
      # shipment-service'in giriş hesabı açmak için kullandığı servis hesabı istemcisinin sırrı (yerel varsayılan vardır).
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-local-admin-client-secret}
    ports:
      - "8180:8180"
    volumes:
      # Yalnızca realm yoksa içe aktarılır; yeniden aktarmak için konsoldan realm'i silin veya `down -v` yapın.
      - ./keycloak/yarnshipment-realm-local.json:/opt/keycloak/data/import/yarnshipment-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
