# Yerel geliştirme ortamı (veritabanı tasarımı, "Yerel geliştirme").
# Kullanım: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml up -d
# MinIO (S3 uyumlu kanıt deposu) 9000'de, konsolu 9001'de çalışır. Keycloak `yarnshipment` realm'i deploy/keycloak altından açılışta içe aktarılır.
name: yarn-shipment

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env içinde POSTGRES_PASSWORD tanımlayın}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?deploy/.env içinde LOCAL_DB_PASSWORD tanımlayın}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # Gateway oturumları; şifre ortamdan verilir, veri kalıcı değildir (yeniden başlayınca oturumlar düşer).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?deploy/.env içinde REDIS_PASSWORD tanımlayın}", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--http-port=8180", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${LOCAL_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?deploy/.env içinde KEYCLOAK_ADMIN_PASSWORD tanımlayın}
      # Realm dosyasındaki ${...} yer tutucuları Keycloak tarafından bu ortam değişkenlerinden doldurulur.
      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD:?deploy/.env içinde KEYCLOAK_TEST_USER_PASSWORD tanımlayın}
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?deploy/.env içinde GATEWAY_CLIENT_SECRET tanımlayın}
      # shipment-service'in giriş hesabı açmak için kullandığı servis hesabı istemcisinin sırrı (yerel varsayılan vardır).
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-local-admin-client-secret}
    ports:
      - "8180:8180"
    volumes:
      # Yalnızca realm yoksa içe aktarılır; yeniden aktarmak için konsoldan realm'i silin veya `down -v` yapın.
      - ./keycloak/yarnshipment-realm-local.json:/opt/keycloak/data/import/yarnshipment-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.0
    # Tek düğüm KRaft (pilot için yeterli, mimari doküman). Konular ilk olayla kendiliğinden açılır.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio:
    # minio/minio ve minio/mc imajları Docker Hub'dan kaldırıldı; Chainguard'ın derlemesi kullanılır. `-dev` etiketi
    # sağlık kontrolü ve kova açma betiği için kabuk ve mc içerir. Sürüm özetle sabitlenir.
    image: chainguard/minio:latest-dev@sha256:d217f9474062b905846b25f59763a408b1bed15a2c5f931e7b0d099b38334698
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${EVIDENCE_STORAGE_ACCESS_KEY:?deploy/.env içinde EVIDENCE_STORAGE_ACCESS_KEY tanımlayın}
      MINIO_ROOT_PASSWORD: ${EVIDENCE_STORAGE_SECRET_KEY:?deploy/.env içinde EVIDENCE_STORAGE_SECRET_KEY tanımlayın}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: chainguard/minio-client:latest-dev@sha256:78e1d95a22be2ce6704d3d00605b907f4c65a59dd8e0f70669371570e2167570
    # Kanıt kovasını bir kez açar; kova zaten varsa dokunmaz.
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$${EVIDENCE_STORAGE_BUCKET:-evidence}"
    environment:
      MINIO_ROOT_USER: ${EVIDENCE_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${EVIDENCE_STORAGE_SECRET_KEY}
      EVIDENCE_STORAGE_BUCKET: ${EVIDENCE_STORAGE_BUCKET:-evidence}
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
