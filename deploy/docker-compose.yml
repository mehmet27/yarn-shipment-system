# Yerel geliştirme ortamı (veritabanı tasarımı, "Yerel geliştirme").
# Kullanım: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml up -d
# Kafka ve MinIO sonraki adımlarda eklenecek. Keycloak realm'i (roller, claim mapper'ları) ayrı PR'da içe aktarılacak.
name: yarn-shipment

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env içinde POSTGRES_PASSWORD tanımlayın}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?deploy/.env içinde LOCAL_DB_PASSWORD tanımlayın}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--http-port=8180"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${LOCAL_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?deploy/.env içinde KEYCLOAK_ADMIN_PASSWORD tanımlayın}
    ports:
      - "8180:8180"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
