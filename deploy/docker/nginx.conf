# Uygulama adresi: statik dosyalar burada, API ve giriş yolları gateway'e gider.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # Gateway: API, OAuth2 girişi/dönüşü ve çıkış.
    location ~ ^/(api/|oauth2/|login/oauth2/|logout) {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS'i Caddy sonlandırır; şemayı ondan alıp gateway'e aynen iletiriz (oturum çerezi Secure olsun).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Karma adlı dosyalar uzun süre önbelleğe alınır.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
