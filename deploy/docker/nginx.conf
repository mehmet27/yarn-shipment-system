# Uygulama adresi: statik dosyalar burada, API yolları uygulamaya gider.

# Gerçek istemci adresi: önümüzdeki Caddy (aynı Docker ağı) X-Forwarded-For ile iletir. Yalnızca iç ağdan gelen başlığa
# güvenilir; hız sınırı ve uygulama logları böylece Caddy'nin değil istemcinin adresini görür.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Giriş ve şifre talebi uçlarına adres başına hız sınırı: şifre deneme (kaba kuvvet / çok hesapta tek şifre) ve her
# denemede harcanan BCrypt işlemcisiyle sunucuyu yorma saldırılarını yavaşlatır. Hesap kilidi (5 yanlış deneme, 15 dk)
# uygulamadadır; bu sınır ona ektir. Fabrikanın tamamı tek adresten çıksa bile dakikada 30 giriş yeterlidir.
limit_req_zone $binary_remote_addr zone=giris:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # Güvenlik başlıkları (statik sayfa için; API cevaplarına uygulama kendi başlıklarını ekler). Uygulama başka bir
    # sitenin çerçevesi içinde açılamaz (tıklama tuzağı), tarayıcı dosya türünü tahmin etmez, dışarı giden bağlantıya
    # sayfa adresi sızmaz. İçerik politikası yalnızca çerçeve, eklenti ve <base> kısıtlarını taşır; betik ve stil
    # kısıtı (script-src / style-src) PDF ve etiket üretimi sınanmadan açılmamalıdır.
    # Not: nginx'te bir konum kendi add_header satırını yazınca üst bloktakiler düşer; bu yüzden başlıklar statik
    # konumların içinde include edilir (guvenlik-basliklari.inc).

    # Giriş ve şifre talebi: hız sınırlı. Sınırı aşan istek 429 alır.
    location ~ ^/api/v1/auth/(login|password-requests)$ {
        limit_req zone=giris burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://yarnshipment-app:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # API (giriş ve çıkış dahil) doğrudan uygulamaya gider.
    location /api/ {
        proxy_pass http://yarnshipment-app:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS'i Caddy sonlandırır; şemayı ondan alıp uygulamaya aynen iletiriz (oturum çerezi Secure olsun).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Karma adlı dosyalar uzun süre önbelleğe alınır.
    location /assets/ {
        include /etc/nginx/conf.d/guvenlik-basliklari.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer.
    location / {
        include /etc/nginx/conf.d/guvenlik-basliklari.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
