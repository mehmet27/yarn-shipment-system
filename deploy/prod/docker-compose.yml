# Üretim kurulumu (tek sunucu). Kullanım: ./deploy/prod/install.sh  (ayrıntı: DEPLOY.md)
# Dışarıya yalnızca Caddy'nin 80/443 portları açılır; veritabanı, MinIO ve uygulama iç ağda kalır.
name: yarn-shipment-prod

x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/yarnshipment
  DB_USER: yarnshipment
  DB_PASSWORD: ${DB_PASSWORD:?.env içinde DB_PASSWORD tanımlayın}

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST}
      FILES_HOST: ${FILES_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?.env içinde ACME_EMAIL tanımlayın}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # Konteynerler genel adresleri (MinIO yükleme adresi) iç ağda Caddy'ye çözer; geçerli sertifika sayesinde TLS doğrulaması geçer.
        aliases:
          - ${APP_HOST}
          - ${FILES_HOST}

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - yarnshipment-app

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env içinde POSTGRES_PASSWORD tanımlayın}
      # initdb betiği yarnshipment kullanıcısının şifresi olarak bunu okur.
      LOCAL_DB_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: chainguard/minio:latest-dev@sha256:d217f9474062b905846b25f59763a408b1bed15a2c5f931e7b0d099b38334698
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${EVIDENCE_STORAGE_ACCESS_KEY:?.env içinde EVIDENCE_STORAGE_ACCESS_KEY tanımlayın}
      MINIO_ROOT_PASSWORD: ${EVIDENCE_STORAGE_SECRET_KEY:?.env içinde EVIDENCE_STORAGE_SECRET_KEY tanımlayın}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: chainguard/minio-client:latest-dev@sha256:78e1d95a22be2ce6704d3d00605b907f4c65a59dd8e0f70669371570e2167570
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/evidence"
    environment:
      MINIO_ROOT_USER: ${EVIDENCE_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${EVIDENCE_STORAGE_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy

  # Tek uygulama: shipment, discrepancy, evidence, reporting ve audit modülleri tek süreçte çalışır
  # (modüller arası olaylar süreç içinde taşınır; ayrı mesaj kuyruğu yoktur).
  yarnshipment-app:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args: { MODULE: yarnshipment-app }
    environment:
      <<: *service-env
      # İlk kurulumda `admin` hesabının şifresi (yalnızca hesap yoksa ya da şifresi atanmamışsa kullanılır); ilk girişte
      # değiştirmesi istenir.
      YARNSHIPMENT_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?.env içinde INITIAL_ADMIN_PASSWORD tanımlayın}
      # Oturum çerezi yalnızca HTTPS üzerinden gönderilir; TLS'i Caddy sonlandırır, X-Forwarded-* başlıklarına güvenilir.
      SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Yükleme/indirme adresleri tarayıcıya verildiği için genel adres kullanılır.
      EVIDENCE_STORAGE_ENDPOINT: https://${FILES_HOST}
      EVIDENCE_STORAGE_BUCKET: evidence
      EVIDENCE_STORAGE_ACCESS_KEY: ${EVIDENCE_STORAGE_ACCESS_KEY}
      EVIDENCE_STORAGE_SECRET_KEY: ${EVIDENCE_STORAGE_SECRET_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
