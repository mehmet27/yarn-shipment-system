# Üretim kurulumu (tek sunucu). Kullanım: ./deploy/prod/install.sh  (ayrıntı: DEPLOY.md)
# Dışarıya yalnızca Caddy'nin 80/443 portları açılır; veritabanı ve uygulama iç ağda kalır.
name: yarn-shipment-prod

x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/yarnshipment
  DB_USER: yarnshipment
  DB_PASSWORD: ${DB_PASSWORD:?.env içinde DB_PASSWORD tanımlayın}

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?.env içinde ACME_EMAIL tanımlayın}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - yarnshipment-app

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env içinde POSTGRES_PASSWORD tanımlayın}
      # initdb betiği yarnshipment kullanıcısının şifresi olarak bunu okur.
      LOCAL_DB_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Tek uygulama: shipment, discrepancy, evidence, reporting ve audit modülleri tek süreçte çalışır
  # (modüller arası olaylar süreç içinde taşınır; ayrı mesaj kuyruğu yoktur).
  yarnshipment-app:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args: { MODULE: yarnshipment-app }
    environment:
      <<: *service-env
      # İlk kurulumda `admin` hesabının şifresi (yalnızca hesap yoksa ya da şifresi atanmamışsa kullanılır); ilk girişte
      # değiştirmesi istenir.
      YARNSHIPMENT_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?.env içinde INITIAL_ADMIN_PASSWORD tanımlayın}
      # Oturum çerezi yalnızca HTTPS üzerinden gönderilir; TLS'i Caddy sonlandırır, X-Forwarded-* başlıklarına güvenilir.
      SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Kanıt dosyaları bu birime yazılır (yedeklenecek yer, bkz. DEPLOY.md); adresleri bu anahtarla uygulama imzalar.
      EVIDENCE_STORAGE_ROOT: /data/evidence
      EVIDENCE_STORAGE_SIGNING_KEY: ${EVIDENCE_STORAGE_SIGNING_KEY:?.env içinde EVIDENCE_STORAGE_SIGNING_KEY tanımlayın}
    volumes:
      - evidence-data:/data/evidence
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  evidence-data:
  caddy-data:
  caddy-config:
