# CONF-01: ortamdan gelen değerler ortam değişkeniyle verilir; gizli bilgi bu dosyaya yazılmaz (SEC-14).
spring:
  application:
    name: audit-service
  datasource:
    # Tek veritabanı, tek kullanıcı; servis tabloları kendi şemasında (audit) durur (docs/veritabani-tasarimi.md).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yarnshipment}
    username: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    hikari:
      schema: audit
  flyway:
    default-schema: audit
    schemas: audit
    create-schemas: true
    placeholders:
      app_role: ${DB_USER:yarnshipment}
      readonly_role: ${DB_USER:yarnshipment}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/yarnshipment}
          audiences: yarnshipment-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service
      # Servis ilk açıldığında konulardaki geçmiş olaylar da zincire yazılır.
      auto-offset-reset: earliest
server:
  port: ${SERVER_PORT:8088}
yarnshipment:
  audit:
    # Audit ekranı ayrı bağlantı kullanır ama artık aynı kullanıcıyla (okuma/yazma ayrımı yok, bkz. docs).
    reader:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/yarnshipment}
      schema: audit
      username: ${DB_USER:yarnshipment}
      password: ${DB_PASSWORD}
    chain-verification:
      cron: ${AUDIT_CHAIN_VERIFICATION_CRON:0 0 3 * * *}
