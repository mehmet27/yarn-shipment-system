# CONF-01: ortamdan gelen değerler ortam değişkeniyle verilir; gizli bilgi bu dosyaya yazılmaz (SEC-14).
spring:
  application:
    name: bag-service
  datasource:
    # Tek veritabanı, tek kullanıcı; servis tabloları kendi şemasında (bag) durur (docs/veritabani-tasarimi.md).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yarnshipment}
    username: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    hikari:
      schema: bag
  flyway:
    default-schema: bag
    schemas: bag
    create-schemas: true
    placeholders:
      app_role: ${DB_USER:yarnshipment}
      readonly_role: ${DB_USER:yarnshipment}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/yarnshipment}
          audiences: yarnshipment-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: bag-service
      # Servis ilk açıldığında konudaki geçmiş parti kilitleri de işlenir; kilit olmadan partiye çuval bağlanamaz.
      auto-offset-reset: earliest
server:
  port: ${SERVER_PORT:8084}
