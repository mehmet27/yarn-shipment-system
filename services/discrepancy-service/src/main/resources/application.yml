# CONF-01: ortamdan gelen değerler ortam değişkeniyle verilir; gizli bilgi bu dosyaya yazılmaz (SEC-14).
spring:
  application:
    name: discrepancy-service
  datasource:
    # Tek veritabanı, tek kullanıcı; servis tabloları kendi şemasında (discrepancy) durur (docs/veritabani-tasarimi.md).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yarnshipment}
    username: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    hikari:
      schema: discrepancy
  flyway:
    default-schema: discrepancy
    schemas: discrepancy
    create-schemas: true
    placeholders:
      app_role: ${DB_USER:yarnshipment}
      readonly_role: ${DB_USER:yarnshipment}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/yarnshipment}
          audiences: yarnshipment-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: discrepancy-service
      # Servis ilk açıldığında konudaki geçmiş teslim girişleri de karşılaştırılır.
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000
server:
  port: ${SERVER_PORT:8085}
yarnshipment:
  outbox:
    topic: discrepancy.events.v1
    source: /yarn-shipment/discrepancy-service
  discrepancy:
    # Yolda kalma süresi kontrolü (TIME uyuşmazlığı); sınırın kendisi Admin ayar ekranından gelir.
    transit-check:
      initial-delay: ${TRANSIT_CHECK_INITIAL_DELAY:PT1M}
      interval: ${TRANSIT_CHECK_INTERVAL:PT15M}
  evidence-service:
    # İtiraza bağlanan fotoğraf ve lab belgesi isteyenin token'ıyla doğrulanır.
    url: ${EVIDENCE_SERVICE_URL:http://localhost:8086}
