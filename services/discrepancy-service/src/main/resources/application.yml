# CONF-01: ortamdan gelen değerler ortam değişkeniyle verilir; gizli bilgi bu dosyaya yazılmaz (SEC-14).
spring:
  application:
    name: discrepancy-service
  datasource:
    # Uygulama yalnızca DML yetkili rol ile bağlanır; DDL Flyway'in migrator rolüyle yapılır.
    url: ${DISCREPANCY_DB_URL:jdbc:postgresql://localhost:5432/discrepancy_db}
    username: ${DISCREPANCY_DB_APP_USER:discrepancy_app}
    password: ${DISCREPANCY_DB_APP_PASSWORD}
  flyway:
    user: ${DISCREPANCY_DB_MIGRATOR_USER:discrepancy_migrator}
    password: ${DISCREPANCY_DB_MIGRATOR_PASSWORD}
    placeholders:
      app_role: ${DISCREPANCY_DB_APP_USER:discrepancy_app}
      readonly_role: ${DISCREPANCY_DB_READONLY_USER:discrepancy_readonly}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/yarnshipment}
          audiences: yarnshipment-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: discrepancy-service
      # Servis ilk açıldığında konudaki geçmiş teslim girişleri de karşılaştırılır.
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000
server:
  port: ${SERVER_PORT:8085}
yarnshipment:
  outbox:
    topic: discrepancy.events.v1
    source: /yarn-shipment/discrepancy-service
