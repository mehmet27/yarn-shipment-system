openapi: 3.0.3
info:
  title: discrepancy-service API
  version: 1.0.0
  description: |
    Uyuşmazlık okuma, atama ve karara bağlama uçları (API-01). Uyuşmazlıklar teslim girişi karşılaştırmasından
    otomatik açılır; bu API onları incelemeye alır ve çözer. Bir sevkiyatın tüm uyuşmazlıkları çözülünce sevkiyat
    tamamlanır (olayla, shipment-service tarafında).

    Kurallar:
    - Kilo ve yüzde değerleri ondalık dize olarak taşınır, ör. `"40.000"` (API-03).
    - Zamanlar ISO 8601 UTC (API-03).
    - Liste ucu sayfalıdır, `page` 0'dan başlar (API-06).
    - Kullanıcı yalnızca yetkili olduğu lokasyonların uyuşmazlıklarını görür (SEC-03).
    - Durum değiştiren uçlar `Idempotency-Key` başlığını kabul eder (API-04).

    Kalite itirazı (ön analiz, Bölüm 10): fasoncu teslimden sonraki 3 iş günü içinde, teslimde okuttuğu çuvallar için
    fotoğraflı itiraz açar. İtiraz Kırmızı bir `QUALITY` uyuşmazlığıdır ve diğer uyuşmazlıklar gibi atanır ve
    `CLAIM_JUSTIFIED` / `CLAIM_UNJUSTIFIED` ile karara bağlanır. Kalite, karardan önce numune ya da lab kontrolü
    isteyebilir ve sonucu (lab için belgeyle) girer.
servers:
  - url: /
tags:
  - name: Discrepancies
  - name: DiscrepancyDecisions
  - name: QualityClaims
security:
  - bearerAuth: []
paths:
  /api/v1/discrepancies:
    get:
      tags: [Discrepancies]
      operationId: listDiscrepancies
      summary: Uyuşmazlık listesi
      description: Vadesi yakın olan önce gelir; aynı vadede RED, YELLOW'dan önce sıralanır.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DiscrepancyStatus'
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Severity'
        - name: assigneeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: shipmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/discrepancies/{discrepancyId}:
    get:
      tags: [Discrepancies]
      operationId: getDiscrepancy
      summary: Uyuşmazlık detayı
      parameters:
        - $ref: '#/components/parameters/DiscrepancyId'
      responses:
        '200':
          description: Uyuşmazlık
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/discrepancies/{discrepancyId}/activity:
    get:
      tags: [Discrepancies]
      operationId: listDiscrepancyActivity
      summary: Uyuşmazlık geçmişi (en eskiden yeniye)
      parameters:
        - $ref: '#/components/parameters/DiscrepancyId'
      responses:
        '200':
          description: Etkinlikler
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscrepancyActivityView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/discrepancies/{discrepancyId}/assign:
    post:
      tags: [DiscrepancyDecisions]
      operationId: assignDiscrepancy
      summary: Uyuşmazlığı bir sorumluya atar ve incelemeye alır
      description: Yalnızca OPEN ve IN_REVIEW uyuşmazlıklar atanabilir; yeniden atama sorumluyu değiştirir.
      parameters:
        - $ref: '#/components/parameters/DiscrepancyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDiscrepancyRequest'
      responses:
        '200':
          description: Güncel uyuşmazlık
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/discrepancies/{discrepancyId}/resolve:
    post:
      tags: [DiscrepancyDecisions]
      operationId: resolveDiscrepancy
      summary: Uyuşmazlığı karara bağlar
      description: |
        Çözüm kodu ve not zorunludur. `LIABILITY_ASSIGNED` için sorumlu taraf (`liableParty`) da gerekir.
        Zaten çözülmüş uyuşmazlık tekrar çözülemez.
      parameters:
        - $ref: '#/components/parameters/DiscrepancyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDiscrepancyRequest'
      responses:
        '200':
          description: Güncel uyuşmazlık
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/quality-claims:
    post:
      tags: [QualityClaims]
      operationId: openQualityClaim
      summary: Kalite itirazı açar
      description: |
        Teslimden itibaren 3 iş günü içinde, teslimde okutulmuş çuvallar için açılır. En az bir `QUALITY_CLAIM`
        fotoğrafı gerekir; fotoğraf aynı sevkiyata yüklenmiş olmalıdır. Bir çuval aynı sevkiyatta bir kez itiraz
        edilir. Fasoncu yalnızca kendi sevkiyatına itiraz açar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenQualityClaimRequest'
      responses:
        '201':
          description: Açılan itiraz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityClaimView'
        '400':
          $ref: '#/components/responses/ClaimBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ClaimConflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/quality-claims/shipments/{shipmentId}:
    get:
      tags: [QualityClaims]
      operationId: getShipmentClaims
      summary: Sevkiyatın itiraz dosyası
      description: |
        İtiraz süresi, teslimde okutulan çuvallar ve açılmış itirazlar (kontrolleriyle). Sevkiyat henüz
        karşılaştırılmadıysa `409 QUALITY_CLAIM_NOT_AVAILABLE`.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: İtiraz dosyası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentClaimsView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ClaimConflict'
  /api/v1/quality-claims/{claimId}/inspections:
    post:
      tags: [QualityClaims]
      operationId: requestInspection
      summary: İtiraz için numune ya da lab kontrolü ister
      description: Yalnızca karara bağlanmamış itirazda; kalite ve admin.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInspectionRequest'
      responses:
        '201':
          description: İstenen kontrol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ClaimNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/quality-claims/{claimId}/inspections/{inspectionId}/result:
    post:
      tags: [QualityClaims]
      operationId: recordInspectionResult
      summary: Kontrol sonucunu girer
      description: |
        Sonuç bir kez girilir. Lab sonucu `LAB_RESULT` belgesiyle gelir; numune karşılaştırmasında belge isteğe
        bağlıdır. Belge aynı sevkiyata yüklenmiş olmalıdır.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInspectionResultRequest'
      responses:
        '200':
          description: Sonuçlanan kontrol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionView'
        '400':
          $ref: '#/components/responses/ClaimBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ClaimNotFound'
        '409':
          $ref: '#/components/responses/ClaimConflict'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DiscrepancyId:
      name: discrepancyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: İstek biçimi hatalı
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Oturum yok veya token geçersiz (code AUTHENTICATION_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: İzin yok (ACCESS_DENIED) veya uyuşmazlık kapsam dışı (OUT_OF_SCOPE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Uyuşmazlık yok (DISCREPANCY_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Uyuşmazlık bu işleme uygun durumda değil (DISCREPANCY_NOT_OPEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ClaimBadRequest:
      description: >-
        İstek biçimi hatalı ya da itiraz kuralı tutmadı (QUALITY_CLAIM_BAG_NOT_DELIVERED,
        QUALITY_CLAIM_EVIDENCE_REQUIRED, QUALITY_CLAIM_EVIDENCE_INVALID, QUALITY_CLAIM_RESULT_EVIDENCE_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ClaimConflict:
      description: >-
        İtiraz şu an yapılamıyor (QUALITY_CLAIM_NOT_AVAILABLE, QUALITY_CLAIM_WINDOW_CLOSED,
        QUALITY_CLAIM_BAG_ALREADY_CLAIMED, QUALITY_CLAIM_INSPECTION_RECORDED, DISCREPANCY_NOT_OPEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ClaimNotFound:
      description: İtiraz ya da kontrol yok (QUALITY_CLAIM_NOT_FOUND, INSPECTION_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Kanıt doğrulanamadı; evidence-service yanıt vermedi (EVIDENCE_SERVICE_UNAVAILABLE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: RFC 9457 hata gövdesi (ERR-07). İstemci kararını `code` alanına göre verir.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
    DiscrepancyStatus:
      type: string
      enum: [OPEN, IN_REVIEW, RESOLVED, CLOSED]
    DiscrepancyType:
      type: string
      enum: [QUANTITY, BAG, SEAL, QUALITY, DOCUMENT, PHOTO, TIME]
    Severity:
      type: string
      enum: [YELLOW, RED]
    Resolution:
      type: string
      enum: [TOLERANCE, DATA_ERROR, CLAIM_JUSTIFIED, CLAIM_UNJUSTIFIED, LIABILITY_ASSIGNED]
    DiscrepancyView:
      type: object
      required: [id, discrepancyNo, siteId, shipmentId, type, severity, status, ruleCode, createdAt]
      properties:
        id:
          type: string
          format: uuid
        discrepancyNo:
          type: string
        siteId:
          type: string
          format: uuid
        shipmentId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/DiscrepancyType'
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/DiscrepancyStatus'
        ruleCode:
          type: string
        expectedValue:
          type: string
        actualValue:
          type: string
        diffKg:
          type: string
          description: Ondalık dize, ör. `"40.000"`
        diffPct:
          type: string
          description: Ondalık dize, ör. `"2.00"`
        assigneeId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        resolution:
          $ref: '#/components/schemas/Resolution'
        resolutionNote:
          type: string
        liableParty:
          type: string
        resolvedBy:
          type: string
          format: uuid
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        allowedActions:
          type: array
          description: Bu kullanıcının bu uyuşmazlıkta yapabileceği eylemler (FE-SEC-03)
          items:
            type: string
            enum: [ASSIGN, RESOLVE]
    PageMetadata:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    DiscrepancyPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscrepancyView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    DiscrepancyActivityView:
      type: object
      required: [id, actionType, actorId, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        actionType:
          type: string
          description: OPENED, ASSIGNED, RESOLVED
        note:
          type: string
        evidenceId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
    AssignDiscrepancyRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          format: uuid
    ResolveDiscrepancyRequest:
      type: object
      required: [resolution, note]
      properties:
        resolution:
          $ref: '#/components/schemas/Resolution'
        note:
          type: string
          minLength: 1
          maxLength: 2000
        liableParty:
          type: string
          maxLength: 200
    InspectionKind:
      type: string
      description: SAMPLE fasoncudaki numuneyi şahit numuneyle karşılaştırır; LAB laboratuvar testidir.
      enum: [SAMPLE, LAB]
    OpenQualityClaimRequest:
      type: object
      required: [shipmentId, description, bagKeys, evidenceIds]
      properties:
        shipmentId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 1
          maxLength: 2000
        bagKeys:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 64
        evidenceIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
    RequestInspectionRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/InspectionKind'
        note:
          type: string
          maxLength: 2000
    RecordInspectionResultRequest:
      type: object
      required: [result]
      properties:
        result:
          type: string
          minLength: 1
          maxLength: 2000
        evidenceId:
          type: string
          format: uuid
          description: LAB_RESULT kanıtı; lab kontrolünde zorunlu
    InspectionView:
      type: object
      required: [id, kind, requestedBy, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/InspectionKind'
        requestNote:
          type: string
        requestedBy:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        result:
          type: string
        resultEvidenceId:
          type: string
          format: uuid
        performedBy:
          type: string
          format: uuid
        performedAt:
          type: string
          format: date-time
        allowedActions:
          type: array
          description: Bu kullanıcının bu kontrolde yapabileceği eylemler (FE-SEC-03)
          items:
            type: string
            enum: [RECORD_RESULT]
    QualityClaimView:
      type: object
      required:
        - id
        - discrepancyId
        - discrepancyNo
        - shipmentId
        - status
        - description
        - bagKeys
        - evidenceIds
        - openedBy
        - openedAt
        - deadlineAt
        - inspections
      properties:
        id:
          type: string
          format: uuid
        discrepancyId:
          type: string
          format: uuid
        discrepancyNo:
          type: string
        shipmentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DiscrepancyStatus'
        resolution:
          $ref: '#/components/schemas/Resolution'
        resolutionNote:
          type: string
        description:
          type: string
        bagKeys:
          type: array
          items:
            type: string
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
        openedBy:
          type: string
          format: uuid
        openedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        inspections:
          type: array
          items:
            $ref: '#/components/schemas/InspectionView'
        allowedActions:
          type: array
          description: Bu kullanıcının bu itirazda yapabileceği eylemler (FE-SEC-03)
          items:
            type: string
            enum: [REQUEST_INSPECTION]
    ShipmentClaimsView:
      type: object
      required: [shipmentId, deadlineAt, windowOpen, deliveredKeys, claims]
      properties:
        shipmentId:
          type: string
          format: uuid
        deadlineAt:
          type: string
          format: date-time
          description: İtirazın açılabileceği son an (teslim + 3 iş günü)
        windowOpen:
          type: boolean
        deliveredKeys:
          type: array
          description: Teslimde okutulan çuval anahtarları
          items:
            type: string
        claims:
          type: array
          items:
            $ref: '#/components/schemas/QualityClaimView'
        allowedActions:
          type: array
          description: Bu kullanıcının bu sevkiyatta yapabileceği eylemler (FE-SEC-03)
          items:
            type: string
            enum: [OPEN_CLAIM]
