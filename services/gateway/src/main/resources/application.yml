# CONF-01: ortamdan gelen değerler ortam değişkeniyle verilir; gizli bilgi bu dosyaya yazılmaz (SEC-14).
spring:
  application:
    name: gateway
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/yarnshipment}
        registration:
          keycloak:
            provider: keycloak
            client-id: yarnshipment-gateway
            client-secret: ${GATEWAY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile
            # Tarayıcı gateway'e geliştirme proxy'si üzerinden (5173) de gelse Keycloak'a kayıtlı adres sabit kalır.
            redirect-uri: ${GATEWAY_PUBLIC_URL:http://localhost:8080}/login/oauth2/code/keycloak
  # Oturumlar Redis'te tutulur: gateway yeniden başlasa ya da birden çok kopya çalışsa da kullanıcı oturumda kalır.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    data:
      redis:
        namespace: yarnshipment:gateway:session
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: shipment-service
              uri: ${SHIPMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/shipments/**,/api/v1/master-data/**,/api/v1/settings/**,/api/v1/balances/**,/api/v1/fire-settlements/**,/api/v1/me
              filters:
                # Oturum çerezi servise gitmez; servis yalnızca Bearer token görür.
                - RemoveRequestHeader=Cookie
                - TokenRelay=
            # Marka ayarı: okuma girişsizdir (giriş sayfası da markalı olsun), yazma oturumlu ve token'lıdır.
            - id: branding-read
              uri: ${SHIPMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/branding
                - Method=GET
              filters:
                - RemoveRequestHeader=Cookie
            - id: branding-write
              uri: ${SHIPMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/branding
                - Method=PUT
              filters:
                - RemoveRequestHeader=Cookie
                - TokenRelay=
            - id: bag-service
              uri: ${BAG_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/bags/**
              filters:
                - RemoveRequestHeader=Cookie
                - TokenRelay=
            - id: discrepancy-service
              uri: ${DISCREPANCY_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/discrepancies/**,/api/v1/quality-claims/**
              filters:
                - RemoveRequestHeader=Cookie
                - TokenRelay=
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/audit-log/**
              filters:
                - RemoveRequestHeader=Cookie
                - TokenRelay=
            - id: reporting-service
              uri: ${REPORTING_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/reports/**
              filters:
                - RemoveRequestHeader=Cookie
                - TokenRelay=
            - id: evidence-service
              uri: ${EVIDENCE_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/evidence/**
              filters:
                - RemoveRequestHeader=Cookie
                - TokenRelay=
yarnshipment:
  gateway:
    post-login-url: ${GATEWAY_POST_LOGIN_URL:http://localhost:5173/}
    post-logout-url: ${GATEWAY_POST_LOGOUT_URL:http://localhost:5173/}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
