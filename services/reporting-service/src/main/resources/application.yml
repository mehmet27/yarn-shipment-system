# CONF-01: ortamdan gelen değerler ortam değişkeniyle verilir; gizli bilgi bu dosyaya yazılmaz (SEC-14).
spring:
  application:
    name: reporting-service
  datasource:
    # Tek veritabanı, tek kullanıcı; servis tabloları kendi şemasında (reporting) durur (docs/veritabani-tasarimi.md).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yarnshipment}
    username: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    hikari:
      schema: reporting
  flyway:
    user: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    default-schema: reporting
    schemas: reporting
    create-schemas: true
    placeholders:
      app_role: ${DB_USER:yarnshipment}
      readonly_role: ${DB_USER:yarnshipment}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/yarnshipment}
          audiences: yarnshipment-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reporting-service
      # Okuma modeli olaylardan yeniden kurulabilir; ilk açılışta konudaki tüm geçmiş işlenir.
      auto-offset-reset: earliest
server:
  port: ${SERVER_PORT:8087}
# Bu servis olay yayınlamaz; yalnızca tüketir (outbox yayıncısı topic verilmediği için kapalı kalır).
