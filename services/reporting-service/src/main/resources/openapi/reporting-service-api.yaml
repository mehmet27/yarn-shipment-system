openapi: 3.0.3
info:
  title: reporting-service API
  version: 1.0.0
  description: |
    Panel ana sayfası ve temel raporlar (ön analiz, Bölüm 13). Veriler `shipment.events.v1` ve
    `discrepancy.events.v1` olaylarından üretilen okuma modelinden gelir; kayıt kaynağı değildir ve bu API salt
    okunurdur (Yönetici rolü de kullanır).

    Kurallar:
    - Kilo değerleri ondalık dize olarak taşınır, ör. `"40.000"`; yüzdeler iki ondalıklı dizedir (API-03).
    - Zamanlar ISO 8601 UTC, dönem tarihleri Europe/Istanbul takvim günüdür (API-03).
    - Dönem verilmezse son 30 gün alınır. Sevkiyat ölçütleri sevkiyatın oluşturulma gününe, eşleşme raporu
      karşılaştırma gününe göre sayılır.
    - Kullanıcı yalnızca yetkili olduğu lokasyonların verisini görür (SEC-03). Şoför ve fasoncu rapor görmez.
    - Raporlar kişileri etiketlemez; olgusal göstergelerdir. Şoför, fasoncu ve parti kimlikleri döner, adlar tanım
      servislerinden çözülür.
servers:
  - url: /
tags:
  - name: Reports
security:
  - bearerAuth: []
paths:
  /api/v1/reports/dashboard:
    get:
      tags: [Reports]
      operationId: getDashboard
      summary: Panel ana sayfa özeti
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Dönem özeti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/subcontractors:
    get:
      tags: [Reports]
      operationId: getSubcontractorReport
      summary: Fasoncu bazında sevkiyat sayısı, uyuşmazlık oranı ve ortalama kilo farkı
      description: En yüksek uyuşmazlık oranı önce gelir.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Fasoncu satırları
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyStatsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/shipments:
    get:
      tags: [Reports]
      operationId: getShipmentReport
      summary: Sevkiyat dökümü
      description: |
        Dönemde oluşturulan sevkiyatlar, en yeni önce. En çok 5000 satır döner; dönem daraltılarak fazlasına ulaşılır.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Sevkiyat satırları
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipmentRowView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/subcontractor-balance:
    get:
      tags: [Reports]
      operationId: getSubcontractorBalanceReport
      summary: Fasoncu bazında gönderilen, teslim alınan ve yolda kalan kilo
      description: İptal edilen sevkiyatlar sayılmaz; yolda kalan miktarı en yüksek olan önce gelir.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Fasoncu bakiye satırları
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubcontractorBalanceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/balance-matrix:
    get:
      tags: [Reports]
      operationId: getBalanceMatrix
      summary: İplik cinsi x fasoncu bakiye matrisi
      description: BALANCE_VIEW gerekir. balanceKg hareketlerin işaretli toplamıdır.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Satırlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceMatrixRowView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/fire:
    get:
      tags: [Reports]
      operationId: getFireReport
      summary: Sevkiyat bazında fire dosyaları
      description: REPORT_VIEW gerekir. Dönem tamamlanma tarihine göredir. Oranlar kesirdir (0.0400 = %4).
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteId'
        - name: subcontractorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Satırlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FireRowView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/yarn-vs-fabric:
    get:
      tags: [Reports]
      operationId: getYarnVsFabricReport
      summary: Fasoncu bazında giden iplik ve gelen kumaş
      description: REPORT_VIEW gerekir.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Satırlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YarnVsFabricRowView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/to-invoice:
    get:
      tags: [Reports]
      operationId: getToInvoiceReport
      summary: Faturalanacak fire dosyaları
      description: REPORT_VIEW gerekir. Eksik kilo sıfırdan büyük ve durum TO_INVOICE olanlar.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Satırlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FireRowView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/balance/opening-import:
    post:
      tags: [Reports]
      operationId: importOpeningBalance
      summary: Açılış bakiyesini OPENING hareketi olarak içe aktarır
      description: BALANCE_VIEW gerekir. (fasoncu, iplik cinsi) için OPENING varsa satır atlanır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningImportRequest'
      responses:
        '200':
          description: Özet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    From:
      name: from
      in: query
      required: false
      description: Dönem başı (dahil), Europe/Istanbul günü
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: false
      description: Dönem sonu (dahil), Europe/Istanbul günü
      schema:
        type: string
        format: date
    SiteId:
      name: siteId
      in: query
      required: false
      description: Yalnızca bu lokasyon; kullanıcının yetkili olduğu lokasyonlardan biri olmalıdır
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Dönem geçersiz (REPORT_PERIOD_INVALID)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Oturum yok veya token geçersiz (code AUTHENTICATION_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: İzin yok (ACCESS_DENIED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: RFC 9457 hata gövdesi (ERR-07). İstemci kararını `code` alanına göre verir.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
    DashboardView:
      type: object
      required: [from, to, shipments, quantity, bands, discrepancies, overdueDiscrepancies, largestDifferences]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        shipments:
          $ref: '#/components/schemas/ShipmentTotalsView'
        quantity:
          $ref: '#/components/schemas/QuantityView'
        bands:
          $ref: '#/components/schemas/BandCountsView'
        discrepancies:
          $ref: '#/components/schemas/OpenDiscrepanciesView'
        overdueDiscrepancies:
          type: array
          description: Süresi en çok geçen önce gelir; en çok 10 kayıt
          items:
            $ref: '#/components/schemas/OverdueDiscrepancyView'
        largestDifferences:
          type: array
          description: Mutlak kilo farkı en büyük 5 sevkiyat
          items:
            $ref: '#/components/schemas/LargestDifferenceView'
    ShipmentTotalsView:
      type: object
      required: [total, inProgress, inReview, completed, cancelled]
      properties:
        total:
          type: integer
          format: int32
        inProgress:
          type: integer
          format: int32
          description: Taslak, yüklendi, yolda, teslim bekliyor ve kontrol edilen sevkiyatlar
        inReview:
          type: integer
          format: int32
        completed:
          type: integer
          format: int32
        cancelled:
          type: integer
          format: int32
    QuantityView:
      type: object
      required: [dispatchNetKg, deliveryNetKg, absoluteDiffKg, comparedShipments]
      description: Yalnızca karşılaştırması tamamlanan sevkiyatlar
      properties:
        dispatchNetKg:
          type: string
        deliveryNetKg:
          type: string
        absoluteDiffKg:
          type: string
        comparedShipments:
          type: integer
          format: int32
    BandCountsView:
      type: object
      required: [green, yellow, red]
      properties:
        green:
          type: integer
          format: int32
        yellow:
          type: integer
          format: int32
        red:
          type: integer
          format: int32
    OpenDiscrepanciesView:
      type: object
      description: Dönemden bağımsız, şu an açık olan uyuşmazlıklar
      required: [open, red, yellow, overdue]
      properties:
        open:
          type: integer
          format: int32
        red:
          type: integer
          format: int32
        yellow:
          type: integer
          format: int32
        overdue:
          type: integer
          format: int32
    OverdueDiscrepancyView:
      type: object
      required: [discrepancyId, discrepancyNo, shipmentId, severity, dueAt]
      properties:
        discrepancyId:
          type: string
          format: uuid
        discrepancyNo:
          type: string
        shipmentId:
          type: string
          format: uuid
        severity:
          type: string
          enum: [YELLOW, RED]
        dueAt:
          type: string
          format: date-time
    LargestDifferenceView:
      type: object
      required: [shipmentId, shipmentNo, diffKg, band]
      properties:
        shipmentId:
          type: string
          format: uuid
        shipmentNo:
          type: string
        diffKg:
          type: string
          description: Çıkış net − teslim net
        diffPct:
          type: string
        band:
          type: string
          enum: [GREEN, YELLOW, RED]
    PartyStatsView:
      type: object
      required: [id, shipmentCount, discrepantShipmentCount, discrepancyRate, averageAbsoluteDiffKg]
      properties:
        id:
          type: string
          format: uuid
          description: Şoför ya da fasoncu kimliği
        shipmentCount:
          type: integer
          format: int32
          description: Karşılaştırması tamamlanan sevkiyat sayısı
        discrepantShipmentCount:
          type: integer
          format: int32
        discrepancyRate:
          type: string
          description: Uyuşmazlıklı sevkiyat yüzdesi
        averageAbsoluteDiffKg:
          type: string
    ShipmentRowView:
      type: object
      required: [shipmentId, shipmentNo, subcontractorId, status, hadDiscrepancy, createdAt]
      properties:
        shipmentId:
          type: string
          format: uuid
        shipmentNo:
          type: string
        subcontractorId:
          type: string
          format: uuid
        status:
          type: string
        dispatchNetKg:
          type: string
        deliveryNetKg:
          type: string
        diffKg:
          type: string
          description: Çıkış net − teslim net; karşılaştırılmadıysa yoktur
        diffPct:
          type: string
        band:
          type: string
          enum: [GREEN, YELLOW, RED]
        hadDiscrepancy:
          type: boolean
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    SubcontractorBalanceView:
      type: object
      required: [subcontractorId, shipmentCount, dispatchedKg, deliveredKg, inTransitKg, differenceKg]
      properties:
        subcontractorId:
          type: string
          format: uuid
        shipmentCount:
          type: integer
          format: int32
        dispatchedKg:
          type: string
          description: Çıkış net toplamı
        deliveredKg:
          type: string
          description: Teslim net toplamı
        inTransitKg:
          type: string
          description: Henüz teslim kaydı olmayan sevkiyatların çıkış net toplamı
        differenceKg:
          type: string
          description: Teslim edilmiş sevkiyatlarda çıkış − teslim (fire)
    BalanceMatrixRowView:
      type: object
      required: [yarnType, subcontractorId, subcontractorName, balanceKg, inTransitKg]
      properties:
        yarnType: {type: string}
        subcontractorId: {type: string, format: uuid}
        subcontractorName: {type: string}
        balanceKg: {type: string, description: Net kg, 3 ondalık, işaretli}
        inTransitKg: {type: string, description: Henüz teslim edilmemiş DISPATCH kilosu}
    FireRowView:
      type: object
      required: [shipmentId, shipmentNo, subcontractorId, subcontractorName, sentKg, returnedYarnKg, fabricKg, fireRate, expectedFabricKg, actualFireRate, shortageKg, status]
      properties:
        shipmentId: {type: string, format: uuid}
        shipmentNo: {type: string}
        subcontractorId: {type: string, format: uuid}
        subcontractorName: {type: string}
        sentKg: {type: string}
        returnedYarnKg: {type: string}
        fabricKg: {type: string}
        fireRate: {type: string, description: Kesir, 4 ondalık}
        expectedFabricKg: {type: string}
        actualFireRate: {type: string, description: Kesir, 4 ondalık}
        shortageKg: {type: string}
        status: {type: string, enum: [AWAITING_FABRIC, TO_INVOICE, CLOSED]}
        invoiceNo: {type: string, nullable: true}
        invoicedAt: {type: string, format: date-time, nullable: true}
    YarnVsFabricRowView:
      type: object
      required: [subcontractorId, subcontractorName, sentKg, returnedYarnKg, fabricKg, actualFireRate, shortageKg]
      properties:
        subcontractorId: {type: string, format: uuid}
        subcontractorName: {type: string}
        sentKg: {type: string}
        returnedYarnKg: {type: string}
        fabricKg: {type: string}
        actualFireRate: {type: string}
        shortageKg: {type: string}
    OpeningRowRequest:
      type: object
      required: [subcontractorId, subcontractorName, yarnType, netKg]
      properties:
        subcontractorId: {type: string, format: uuid}
        subcontractorName: {type: string, minLength: 1}
        yarnType: {type: string, minLength: 1}
        netKg: {type: string, pattern: '^-?\d{1,11}(\.\d{1,3})?$'}
    OpeningImportRequest:
      type: object
      required: [asOf, rows]
      properties:
        asOf: {type: string, format: date}
        rows:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/OpeningRowRequest'
    OpeningImportResult:
      type: object
      required: [imported, skipped]
      properties:
        imported: {type: integer, format: int32}
        skipped: {type: integer, format: int32}
