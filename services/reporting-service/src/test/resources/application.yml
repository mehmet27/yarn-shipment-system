# reporting modülünün dilim testleri için ayarlar; üretim ayarı yarnshipment-app içindedir.
# Her modül yalnız kendi şemasına bağlanır (search_path tek şema), tablolar şemasız adlarla erişilir.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yarnshipment}
    username: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    hikari:
      schema: reporting
  flyway:
    user: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    default-schema: reporting
    schemas: reporting
    create-schemas: true
    placeholders:
      app_role: ${DB_USER:yarnshipment}
      readonly_role: ${DB_USER:yarnshipment}
  messages:
    basename: reporting-messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
yarnshipment:
  security:
    # Testler oturum çerezi yerine doğrudan kimlik verir; CSRF yalnızca common-security testlerinde denenir.
    csrf-enabled: false
