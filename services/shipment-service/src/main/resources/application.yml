# CONF-01: ortamdan gelen değerler ortam değişkeniyle verilir; gizli bilgi bu dosyaya yazılmaz (SEC-14).
spring:
  application:
    name: shipment-service
  datasource:
    # Uygulama yalnızca DML yetkili rol ile bağlanır; DDL Flyway'in migrator rolüyle yapılır.
    url: ${SHIPMENT_DB_URL:jdbc:postgresql://localhost:5432/shipment_db}
    username: ${SHIPMENT_DB_APP_USER:shipment_app}
    password: ${SHIPMENT_DB_APP_PASSWORD}
  flyway:
    user: ${SHIPMENT_DB_MIGRATOR_USER:shipment_migrator}
    password: ${SHIPMENT_DB_MIGRATOR_PASSWORD}
    placeholders:
      app_role: ${SHIPMENT_DB_APP_USER:shipment_app}
      readonly_role: ${SHIPMENT_DB_READONLY_USER:shipment_readonly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    # API-03 ve SEC-05: henüz girilmemiş değerler JSON'da yer almaz.
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # EVT-04: aynı sevkiyatın olayları sıralı; onay tüm kopyalardan, tekrar gönderimde çift kayıt yok.
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/yarnshipment}
          audiences: yarnshipment-api
server:
  port: ${SERVER_PORT:8083}
yarnshipment:
  outbox:
    # EVT-03/04: outbox_event satırları bu konuya CloudEvents olarak yayınlanır.
    topic: shipment.events.v1
    source: /yarn-shipment/shipment-service
