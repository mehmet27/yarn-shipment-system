# CONF-01: ortamdan gelen değerler ortam değişkeniyle verilir; gizli bilgi bu dosyaya yazılmaz (SEC-14).
spring:
  application:
    name: shipment-service
  datasource:
    # Tek veritabanı, tek kullanıcı; servis tabloları kendi şemasında (shipment) durur (docs/veritabani-tasarimi.md).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yarnshipment}
    username: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    hikari:
      schema: shipment
  flyway:
    user: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    default-schema: shipment
    schemas: shipment
    create-schemas: true
    placeholders:
      app_role: ${DB_USER:yarnshipment}
      readonly_role: ${DB_USER:yarnshipment}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    # API-03 ve SEC-05: henüz girilmemiş değerler JSON'da yer almaz.
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: shipment-service
      # Servis ilk açıldığında konudaki geçmiş karşılaştırma sonuçları da uygulanır.
      auto-offset-reset: earliest
    producer:
      # EVT-04: aynı sevkiyatın olayları sıralı; onay tüm kopyalardan, tekrar gönderimde çift kayıt yok.
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/yarnshipment}
          audiences: yarnshipment-api
server:
  port: ${SERVER_PORT:8083}
yarnshipment:
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info
      # Giriş sayfası da marka rengini okur; yazma ucu yöntem güvenliğiyle (SETTINGS_MANAGE) korunur.
      - /api/v1/branding
  outbox:
    # EVT-03/04: outbox_event satırları bu konuya CloudEvents olarak yayınlanır.
    topic: shipment.events.v1
    source: /yarn-shipment/shipment-service
