problem.DELIVERY_EVIDENCE_INVALID.title=İmzalı irsaliye kanıtı geçersiz
problem.DELIVERY_EVIDENCE_INVALID.detail=Eklenen kanıt bulunamadı, başka sevkiyata ait ya da imzalı irsaliye değil; \
  fotoğrafı yeniden yükleyin.
problem.EVIDENCE_SERVICE_UNAVAILABLE.title=Kanıt servisine ulaşılamadı
problem.EVIDENCE_SERVICE_UNAVAILABLE.detail=İmzalı irsaliye şu an doğrulanamıyor; biraz sonra yeniden deneyin.
