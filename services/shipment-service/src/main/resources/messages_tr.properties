# shipment-service problem metinleri (API-08). Anahtar: problem.<code>.<title|detail>
problem.SHIPMENT_NOT_FOUND.title=Sevkiyat bulunamadı
problem.SHIPMENT_NOT_FOUND.detail=İstenen sevkiyat kaydı yok.
problem.INVALID_SHIPMENT_STATUS.title=İşlem bu durumda yapılamaz
problem.INVALID_SHIPMENT_STATUS.detail=Sevkiyatın güncel durumu bu işleme izin vermiyor; sayfayı yenileyin.
problem.INVALID_COMPLETION.title=Tamamlama bilgileri geçersiz
problem.INVALID_COMPLETION.detail=İrsaliye numarası boş olamaz ve en fazla 64 karakter olabilir.
problem.INVALID_DISPATCH.title=Çıkış bilgileri geçersiz
problem.INVALID_DISPATCH.detail=Girilen tartım değerleri birbiriyle tutarlı değil.
problem.INVALID_SHIPMENT.title=Sevkiyat bilgileri geçersiz
problem.INVALID_SHIPMENT.detail=Şoför ve araç bilgileri kimlik ve ad ya da plaka ile birlikte verilmelidir.
problem.BAG_NOT_FOUND.title=Çuval bulunamadı
problem.BAG_NOT_FOUND.detail=Girilen anahtarlardan en az biri için çuval kaydı yok.
problem.BAG_NOT_AVAILABLE.title=Çuval kullanılamaz
problem.BAG_NOT_AVAILABLE.detail=Çuvalın durumu sevkiyata eklemeye izin vermiyor.
problem.BAG_ALREADY_RESERVED.title=Çuval başka sevkiyatta
problem.BAG_ALREADY_RESERVED.detail=Çuvallardan en az biri başka bir sevkiyata ayrılmış; \
  bir çuval aynı anda tek sevkiyatta olabilir.
problem.BAG_OUT_OF_SCOPE.title=Çuval bu lokasyona ait değil
problem.BAG_OUT_OF_SCOPE.detail=Çuvallardan en az biri yetkili olduğunuz lokasyonlarda değil; hiçbiri atanmadı.
problem.BAG_SERVICE_UNAVAILABLE.title=Çuval servisine ulaşılamadı
problem.BAG_SERVICE_UNAVAILABLE.detail=Çuvallar şu an ayrılamıyor; biraz sonra yeniden deneyin.
problem.INVALID_MASTER_DATA.title=Kayıt bilgileri geçersiz
problem.INVALID_MASTER_DATA.detail=Ad ya da unvan boş olamaz ve en çok 200 karakter olabilir; \
  bağlı fasoncu etkin bir fasoncu olmalıdır; plaka en çok 20 karakter olabilir; \
  giriş hesabı için en az bir etkin lokasyon seçilmelidir; kod ve parti numarası harf ya da rakamla başlar, \
  en çok 40 karakterdir; parti için lokasyon, iplik ve kalite etkin olmalı, üretim tarihi ileride olamaz.
problem.MASTER_DATA_NOT_FOUND.title=Kayıt bulunamadı
problem.MASTER_DATA_NOT_FOUND.detail=İstenen fasoncu, şoför, araç, lokasyon, iplik, kalite ya da parti kaydı yok.
problem.DUPLICATE_CODE.title=Kod zaten kayıtlı
problem.DUPLICATE_CODE.detail=Bu kod ya da parti numarası başka bir kayıtta kullanılıyor; kod tektir.
problem.LOT_QUALITY_LOCKED.title=Partinin kalitesi kilitli
problem.LOT_QUALITY_LOCKED.detail=Kalitesi kilitlenmiş parti değiştirilemez ve yeniden kilitlenemez; \
  yalnızca pasife alınabilir.
problem.DUPLICATE_PLATE.title=Plaka zaten kayıtlı
problem.DUPLICATE_PLATE.detail=Bu plaka başka bir araçta kullanılıyor; plaka tektir.
problem.DUPLICATE_SUBCONTRACTOR.title=Fasoncu zaten kayıtlı
problem.DUPLICATE_SUBCONTRACTOR.detail=Bu ünvanla kayıtlı bir fasoncu var; ünvan tektir.
problem.INVALID_PLATE.title=Plaka geçersiz
problem.INVALID_PLATE.detail=Plaka il kodu (01-81), 1-3 harf ve 2-4 rakamdan oluşmalı; ör. 34 ABC 123.
problem.INVALID_CANCELLATION.title=İptal gerekçesi geçersiz
problem.INVALID_CANCELLATION.detail=İptal gerekçesi boş olamaz ve en çok 500 karakter olabilir.
problem.LOGIN_ACCOUNT_EXISTS.title=Giriş hesabı zaten var
problem.LOGIN_ACCOUNT_EXISTS.detail=Bu kayıt için hesap açılmış ya da bu giriş adı başkasında; \
  farklı bir giriş adı deneyin.
problem.LOGIN_ACCOUNT_UNAVAILABLE.title=Giriş hesabı açılamadı
problem.LOGIN_ACCOUNT_UNAVAILABLE.detail=Kimlik servisine (Keycloak) ulaşılamadı ya da hesap açma yapılandırılmamış; \
  hiçbir hesap açılmadı, biraz sonra yeniden deneyin.
problem.LOGIN_ACCOUNT_NOT_FOUND.title=Giriş hesabı bulunamadı
problem.LOGIN_ACCOUNT_NOT_FOUND.detail=İstenen kullanıcı kimlik servisinde yok.
problem.LOGIN_ACCOUNT_ROLE_LOCKED.title=Rol değiştirilemez
problem.LOGIN_ACCOUNT_ROLE_LOCKED.detail=Şoför ve fasoncu hesapları bir kayda bağlıdır; rolleri buradan değiştirilemez.
problem.INVALID_RESET_CODE.title=Kod geçersiz
problem.INVALID_RESET_CODE.detail=Kod yanlış, süresi dolmuş ya da deneme hakkı bitmiş; yeni kod isteyin.
problem.WEAK_PASSWORD.title=Şifre kurala uymuyor
problem.WEAK_PASSWORD.detail=Şifre en az 8 karakter olmalı ve kimlik servisinin şifre kuralına uymalı.
problem.SMS_UNAVAILABLE.title=SMS gönderilemedi
problem.SMS_UNAVAILABLE.detail=SMS sağlayıcısına ulaşılamadı ya da SMS gönderimi yapılandırılmamış; \
  biraz sonra yeniden deneyin. Hesap açıldıysa yönetici şifre sıfırlamayı yeniden başlatabilir.
problem.WAYBILL_EVIDENCE_INVALID.title=İrsaliye belgesi geçersiz
problem.WAYBILL_EVIDENCE_INVALID.detail=Eklenen belge bulunamadı, başka sevkiyata ait ya da irsaliye değil; \
  belgeyi yeniden yükleyin.
problem.EVIDENCE_SERVICE_UNAVAILABLE.title=Kanıt servisine ulaşılamadı
problem.EVIDENCE_SERVICE_UNAVAILABLE.detail=İrsaliye belgesi şu an doğrulanamıyor; biraz sonra yeniden deneyin.
problem.INVALID_CORRECTION.title=Düzeltme geçersiz
problem.INVALID_CORRECTION.detail=Düzeltilecek kayıt yok, yeni değer eskisiyle aynı ya da tutarsız veya gerekçe boş.
problem.CORRECTION_CONFLICT.title=Kayıt bu arada değişti
problem.CORRECTION_CONFLICT.detail=Düzeltilecek kayıt başka bir düzeltmeyle değişti; sevkiyatı yenileyip tekrar deneyin.
