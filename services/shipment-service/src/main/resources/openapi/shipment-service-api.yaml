openapi: 3.0.3
info:
  title: shipment-service API
  version: 1.0.0
  description: |
    Sevkiyat okuma ve durum geçişi uçları ve oturumdaki kullanıcı (API-01). Controller arayüzleri ve frontend istemcisi bu
    dosyadan üretilir; elle tip yazılmaz.

    Kurallar:
    - Kilo değerleri ondalık dize olarak taşınır, ör. `"1982.500"` (API-03).
    - Zamanlar ISO 8601 UTC (API-03).
    - Liste uçları sayfalıdır, `page` 0'dan başlar (API-06).
    - Akış (saha analizi, 10.11.2026): müdür sevkiyatı açar (DRAFT), depo çıkış tartımını girer
      (AWAITING_DELIVERY), irsaliye müdüre ulaşınca müdür sevkiyatı tamamlar (COMPLETED). Görünüm `audience`
      alanıyla ayrılır; fasoncu görünümünde beklenen yük yer almaz.
    - Butonlar yalnızca `allowedActions` listesine göre gösterilir (FE-SEC-03).
servers:
  - url: /
tags:
  - name: Shipments
  - name: ShipmentCreation
  - name: ShipmentFile
  - name: ShipmentBags
  - name: ShipmentCancellation
  - name: ShipmentWeightDecision
  - name: ShipmentSettings
  - name: ShipmentCorrection
  - name: MasterData
  - name: SubcontractorManagement
  - name: DriverManagement
  - name: VehicleManagement
  - name: SiteManagement
  - name: CatalogLists
  - name: ProductManagement
  - name: QualityGradeManagement
  - name: YarnSupplierManagement
  - name: TareStandardManagement
  - name: LotManagement
  - name: LoginAccounts
  - name: LoginAccountAccess
  - name: Branding
  - name: CurrentUser
security:
  - bearerAuth: []
paths:
  /api/v1/me:
    get:
      tags: [CurrentUser]
      operationId: getCurrentUser
      summary: Oturumdaki kullanıcı, rolleri, izinleri ve kapsamı
      responses:
        '200':
          description: Kullanıcı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/shipments:
    post:
      tags: [ShipmentCreation]
      operationId: createShipment
      summary: Sevkiyat taslağı oluşturur (DRAFT)
      description: |
        Çıkış lokasyonu ve fasoncu ile taslak sevkiyat açar; numara sunucuda üretilir. Lokasyon kullanıcının
        yetkili olduğu lokasyonlardan biri olmalıdır. Şoför ve araç henüz belli değilse hiç gönderilmez; şoför
        kimliği ile adı, araç kimliği ile plakası birlikte gönderilir. Aynı `Idempotency-Key` ile tekrar gönderilen
        istek yeni sevkiyat açmaz, ilk yanıtı döner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Taslak oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShipmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Shipments]
      operationId: listShipments
      summary: Kapsamdaki sevkiyatlar, en yeni önce
      description: Fasoncu yalnızca kendi, iç kullanıcılar yalnızca yetkili oldukları lokasyonlardaki
        sevkiyatları görür. Filtre sorguya eklenir (SEC-03).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          required: false
          description: Yalnızca bu durumlardaki sevkiyatlar
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ShipmentStatus'
          style: form
          explode: true
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/shipments/{shipmentId}:
    get:
      tags: [Shipments]
      operationId: getShipment
      summary: Sevkiyat ayrıntısı, isteyenin görünümüyle
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sevkiyat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/shipments/{shipmentId}/dispatch-weighing:
    post:
      tags: [Shipments]
      operationId: recordDispatchWeighing
      summary: Depo çıkış tartımını kaydeder (DRAFT → AWAITING_DELIVERY)
      description: |
        Depo çalışanı kantar fişindeki brüt, dara ve çuval sayısını girer. Net kilo brüt ile daradan hesaplanır.
        Kayıtla birlikte sevkiyat çıkış yapmış ve teslim bekliyor sayılır. Aynı sevkiyat için tekrar gönderilen
        istek yeni kayıt oluşturmaz ve yine 204 döner.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchWeighingRequest'
      responses:
        '204':
          description: Tartım kaydedildi, sevkiyat teslim bekliyor
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/shipments/{shipmentId}/completion:
    post:
      tags: [Shipments]
      operationId: completeShipment
      summary: İrsaliye müdüre ulaştı, sevkiyatı tamamlar (AWAITING_DELIVERY → COMPLETED)
      description: |
        Müdür irsaliye belgesini önce evidence-service'e WAYBILL türüyle yükler, sonra irsaliye numarası ve belgenin
        kimliğiyle bu ucu çağırır; sevkiyat tamamlanır ve kilitlenir. Belge yoksa, başka sevkiyata aitse ya da irsaliye
        değilse 422 WAYBILL_EVIDENCE_INVALID döner. Aynı irsaliye numarasıyla tekrar gönderilen istek yeni kayıt
        oluşturmaz ve yine 204 döner.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteShipmentRequest'
      responses:
        '204':
          description: Sevkiyat tamamlandı
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: İrsaliye belgesi geçersiz (WAYBILL_EVIDENCE_INVALID)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          $ref: '#/components/responses/BadGateway'
  # Ana veri okuma uçları. Ayrı master-data servisi gelene kadar shipment-service içinde, kendi paketinde ve etiketiyle
  # durur; taşınırken yol ve sözleşme değişmez. İzin: MASTER_DATA_VIEW.
  /api/v1/master-data/subcontractors:
    get:
      tags: [MasterData]
      operationId: listSubcontractors
      summary: Fasoncu listesi
      description: |
        Sevkiyat oluşturma ekranında fasoncu seçimi için. Arama `q` ile ad/unvan/plaka içinde yapılır (büyük-küçük harf duyarsız); sonuçlar kapsama göre süzülür.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcontractorPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [SubcontractorManagement]
      operationId: createSubcontractor
      summary: Fasoncu ekler
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Ünvan boş olamaz ve tektir (büyük/küçük harf ve baş/son boşluk yok sayılır, pasif kayıtlar dahil); kullanılmış ünvan 409 `DUPLICATE_SUBCONTRACTOR` verir. Aynı `Idempotency-Key` ile tekrar gönderilen istek yeni kayıt açmaz, ilk yanıtı döner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubcontractorRequest'
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcontractorView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/master-data/subcontractors/{subcontractorId}:
    put:
      tags: [SubcontractorManagement]
      operationId: updateSubcontractor
      summary: Fasoncu günceller
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Gönderilen alanlar kaydın yeni halidir; kayıt pasif olsa da güncellenebilir. Başka fasoncunun ünvanı 409 `DUPLICATE_SUBCONTRACTOR` verir.
      parameters:
        - name: subcontractorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubcontractorRequest'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcontractorView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/master-data/subcontractors/{subcontractorId}/deactivate:
    post:
      tags: [SubcontractorManagement]
      operationId: deactivateSubcontractor
      summary: Fasoncu pasife alır
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasif kayıt listelerde görünmez, eski sevkiyatlar etkilenmez; kayıt silinmez. Tekrarı zararsızdır.
      parameters:
        - name: subcontractorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/subcontractors/{subcontractorId}/activate:
    post:
      tags: [SubcontractorManagement]
      operationId: activateSubcontractor
      summary: Fasoncu yeniden etkinleştirir
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasife alınmış kaydı listelere geri getirir. Tekrarı zararsızdır.
      parameters:
        - name: subcontractorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/drivers:
    get:
      tags: [MasterData]
      operationId: listDrivers
      summary: Şoför listesi
      description: |
        Şoför seçimi için; `subcontractorId` verilirse yalnızca o fasoncunun şoförleri gelir. Arama `q` ile ad/unvan/plaka içinde yapılır (büyük-küçük harf duyarsız); sonuçlar kapsama göre süzülür.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/StatusFilter'
        - name: subcontractorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [DriverManagement]
      operationId: createDriver
      summary: Şoför ekler
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Fasoncu verilirse etkin bir fasoncu olmalıdır. Aynı `Idempotency-Key` ile tekrar gönderilen istek yeni kayıt açmaz, ilk yanıtı döner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequest'
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/master-data/drivers/{driverId}:
    put:
      tags: [DriverManagement]
      operationId: updateDriver
      summary: Şoför günceller
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Gönderilen alanlar kaydın yeni halidir; kayıt pasif olsa da güncellenebilir.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequest'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/drivers/{driverId}/deactivate:
    post:
      tags: [DriverManagement]
      operationId: deactivateDriver
      summary: Şoför pasife alır
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasif kayıt listelerde görünmez, eski sevkiyatlar etkilenmez; kayıt silinmez. Tekrarı zararsızdır.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/master-data/login-accounts:
    get:
      tags: [LoginAccounts]
      operationId: listLoginAccounts
      summary: Giriş hesabı olan kullanıcıların listesi
      description: |
        Yalnızca yönetici (USER_MANAGE). Keycloak'ta uygulama rollerinden en az birine sahip kullanıcılar giriş adına
        göre sıralı gelir; servis hesapları listede yoktur. Arama `q` ile giriş adı ve adda yapılır
        (büyük-küçük harf duyarsız). Şifre ya da başka kimlik bilgisi hiçbir zaman dönmez. Keycloak'a ulaşılamazsa ya
        da yapılandırılmamışsa 502 `LOGIN_ACCOUNT_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchText'
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAccountPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
    post:
      tags: [LoginAccounts]
      operationId: createStaffLoginAccount
      summary: Fabrika içi giriş hesabı açar
      description: |
        Yalnızca yönetici (USER_MANAGE). Depo, kalite, müdür ya da yönetici hesabını Keycloak'ta yöneticinin yazdığı
        geçici şifreyle açar ve rolü verir; kişi ilk girişte şifresini değiştirir. SMS ya da e-posta doğrulaması yoktur.
        Fabrikada tek merkez lokasyon vardır; hesap etkin tüm lokasyonları görür. Şifre hiçbir yanıtta ya da logda yer
        almaz. Giriş adı alınmışsa 409 `LOGIN_ACCOUNT_EXISTS`; şifre kurala uymuyorsa 400 `WEAK_PASSWORD`; Keycloak
        çalışmazsa 502 `LOGIN_ACCOUNT_UNAVAILABLE` (yarım hesap bırakılmaz).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginAccountRequest'
      responses:
        '201':
          description: Hesap açıldı
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/master-data/user-names:
    get:
      tags: [UserNames]
      operationId: listUserNames
      summary: Kullanıcı kimliklerinin okunur adları
      description: |
        Denetim kaydı gibi ekranlarda kimliği ada çevirir. Yönetici (USER_MANAGE) ve denetim görüntüleyen roller
        (AUDIT_VIEW) okur; yalnızca ad soyad (yoksa giriş adı) döner. Keycloak'ta
        bulunmayan kimlik yanıtta olmaz. Keycloak'a ulaşılamazsa 502 `LOGIN_ACCOUNT_UNAVAILABLE`.
      parameters:
        - name: ids
          in: query
          required: true
          description: Kullanıcı kimlikleri (en çok 100)
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
          style: form
          explode: true
      responses:
        '200':
          description: Adı bulunan kullanıcılar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNameListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/master-data/login-accounts/{userId}/role:
    put:
      tags: [LoginAccounts]
      operationId: changeLoginAccountRole
      summary: Fabrika içi hesabın rolünü değiştirir
      description: |
        Yalnızca yönetici (USER_MANAGE). Kullanıcının fabrika içi rolünü (depo, kalite, müdür, yönetici) yenisiyle
        değiştirir ve açık oturumlarını kapatır; kişi yeni rolle yeniden giriş yapar. Kişi kendi rolünü değiştiremez
        (400 `INVALID_MASTER_DATA`, `userId`). Fasoncu hesapları kayda bağlı olduğundan değiştirilemez
        (409 `LOGIN_ACCOUNT_ROLE_LOCKED`). Kullanıcı yoksa 404 `LOGIN_ACCOUNT_NOT_FOUND`.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeLoginAccountRoleRequest'
      responses:
        '204':
          description: Rol değişti
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/master-data/login-accounts/{userId}/enabled:
    put:
      tags: [LoginAccountAccess]
      operationId: changeLoginAccountEnabled
      summary: Giriş hesabını pasife alır ya da yeniden açar
      description: |
        Yalnızca yönetici (USER_MANAGE). Pasife alınan kullanıcı giremez ve açık oturumları kapanır; veri silinmez.
        Kişi kendi hesabını kapatamaz (400 `INVALID_MASTER_DATA`, `userId`). Kullanıcı yoksa 404
        `LOGIN_ACCOUNT_NOT_FOUND`.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeLoginAccountEnabledRequest'
      responses:
        '204':
          description: Yapıldı
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
