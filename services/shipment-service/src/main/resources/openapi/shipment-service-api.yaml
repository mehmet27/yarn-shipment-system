openapi: 3.0.3
info:
  title: shipment-service API
  version: 1.0.0
  description: |
    Sevkiyat okuma ve durum geçişi uçları ve oturumdaki kullanıcı (API-01). Controller arayüzleri ve frontend istemcisi bu
    dosyadan üretilir; elle tip yazılmaz.

    Kurallar:
    - Kilo değerleri ondalık dize olarak taşınır, ör. `"1982.500"` (API-03).
    - Zamanlar ISO 8601 UTC (API-03).
    - Liste uçları sayfalıdır, `page` 0'dan başlar (API-06).
    - Kör giriş (SEC-05): fasoncu ve şoför görünümlerinde karşı tarafın tartı alanları ve beklenen çuval
      sayısı hiç yer almaz; depo görünümünde teslim alanları yer almaz. Görünüm `audience` alanıyla ayrılır.
    - Butonlar yalnızca `allowedActions` listesine göre gösterilir (FE-SEC-03).
servers:
  - url: /
tags:
  - name: Shipments
  - name: ShipmentCreation
  - name: ShipmentFile
  - name: ShipmentBags
  - name: ShipmentCancellation
  - name: MasterData
  - name: SubcontractorManagement
  - name: DriverManagement
  - name: VehicleManagement
  - name: SiteManagement
  - name: CurrentUser
security:
  - bearerAuth: []
paths:
  /api/v1/me:
    get:
      tags: [CurrentUser]
      operationId: getCurrentUser
      summary: Oturumdaki kullanıcı, rolleri, izinleri ve kapsamı
      responses:
        '200':
          description: Kullanıcı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/shipments:
    post:
      tags: [ShipmentCreation]
      operationId: createShipment
      summary: Sevkiyat taslağı oluşturur (DRAFT)
      description: |
        Çıkış lokasyonu ve fasoncu ile taslak sevkiyat açar; numara sunucuda üretilir. Lokasyon kullanıcının
        yetkili olduğu lokasyonlardan biri olmalıdır. Şoför ve araç henüz belli değilse hiç gönderilmez; şoför
        kimliği ile adı, araç kimliği ile plakası birlikte gönderilir. Aynı `Idempotency-Key` ile tekrar gönderilen
        istek yeni sevkiyat açmaz, ilk yanıtı döner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Taslak oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShipmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Shipments]
      operationId: listShipments
      summary: Kapsamdaki sevkiyatlar, en yeni önce
      description: Fasoncu yalnızca kendi, şoför yalnızca kendisine atanmış, iç kullanıcılar yalnızca yetkili
        oldukları lokasyonlardaki sevkiyatları görür. Filtre sorguya eklenir (SEC-03).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          required: false
          description: Yalnızca bu durumlardaki sevkiyatlar
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ShipmentStatus'
          style: form
          explode: true
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/shipments/{shipmentId}:
    get:
      tags: [Shipments]
      operationId: getShipment
      summary: Sevkiyat ayrıntısı, isteyenin görünümüyle
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sevkiyat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/shipments/{shipmentId}/pickup-confirmation:
    post:
      tags: [Shipments]
      operationId: confirmPickup
      summary: Şoför yükü teslim aldığını beyan eder (LOADED → IN_TRANSIT)
      description: |
        Gövde yoktur; şoför çıkışta kaydedilen çuval sayısını ve mühür numarasını onaylar. Yalnızca sevkiyata
        atanmış şoför çağırabilir (`allowedActions` içinde `CONFIRM_PICKUP`). Aynı sevkiyat için tekrar gönderilen
        istek (zayıf bağlantıda yeniden deneme) yeni kayıt oluşturmaz ve yine 204 döner.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Beyan kaydedildi, sevkiyat yolda
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/shipments/{shipmentId}/delivery-receipt:
    post:
      tags: [Shipments]
      operationId: submitDeliveryReceipt
      summary: Fasoncu kör teslim girişini gönderir (AWAITING_DELIVERY → CHECKING)
      description: |
        Fasoncu çıkış tartısını, beklenen yükü ve çıkış mühür numarasını görmeden kendi ölçümünü girer (SEC-05).
        Gönderilen tutanak kilitlenir, değişiklik yalnızca düzeltme talebiyle yapılır. Okutulan anahtar listede
        yoksa da saklanır; eşleşme karşılaştırması discrepancy-service'tedir. Aynı sevkiyat için tekrar gönderilen
        istek yeni kayıt oluşturmaz ve yine 204 döner.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryReceiptRequest'
      responses:
        '204':
          description: Tutanak kaydedildi, sevkiyat kontrolde
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/shipments/{shipmentId}/dispatch-weighing:
    post:
      tags: [Shipments]
      operationId: recordDispatchWeighing
      summary: Depo çıkış tartımını ve mührü kaydeder (DRAFT → LOADED)
      description: |
        Depo çalışanı kantar fişindeki brüt, dara ve çuval sayısını ile araca vurulan mühür numarasını girer.
        Net kilo brüt ile daradan hesaplanır. Mühür numarası tek kullanımlıktır: başka bir sevkiyatın çıkışında
        kullanılmışsa 409 döner. Kayıtla birlikte sevkiyat yüklendi sayılır. Aynı sevkiyat için tekrar gönderilen
        istek yeni kayıt oluşturmaz ve yine 204 döner.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchWeighingRequest'
      responses:
        '204':
          description: Tartım ve mühür kaydedildi, sevkiyat yüklendi
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # Ana veri okuma uçları. Ayrı master-data servisi gelene kadar shipment-service içinde, kendi paketinde ve etiketiyle
  # durur; taşınırken yol ve sözleşme değişmez. İzin: MASTER_DATA_VIEW.
  /api/v1/master-data/subcontractors:
    get:
      tags: [MasterData]
      operationId: listSubcontractors
      summary: Fasoncu listesi
      description: |
        Sevkiyat oluşturma ekranında fasoncu seçimi için. Arama `q` ile ad/unvan/plaka içinde yapılır (büyük-küçük harf duyarsız); sonuçlar kapsama göre süzülür.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcontractorPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [SubcontractorManagement]
      operationId: createSubcontractor
      summary: Fasoncu ekler
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Ünvan boş olamaz. Aynı `Idempotency-Key` ile tekrar gönderilen istek yeni kayıt açmaz, ilk yanıtı döner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubcontractorRequest'
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcontractorView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/master-data/subcontractors/{subcontractorId}:
    put:
      tags: [SubcontractorManagement]
      operationId: updateSubcontractor
      summary: Fasoncu günceller
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Gönderilen alanlar kaydın yeni halidir; kayıt pasif olsa da güncellenebilir.
      parameters:
        - name: subcontractorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubcontractorRequest'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcontractorView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/subcontractors/{subcontractorId}/deactivate:
    post:
      tags: [SubcontractorManagement]
      operationId: deactivateSubcontractor
      summary: Fasoncu pasife alır
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasif kayıt listelerde görünmez, eski sevkiyatlar etkilenmez; kayıt silinmez. Tekrarı zararsızdır.
      parameters:
        - name: subcontractorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/subcontractors/{subcontractorId}/activate:
    post:
      tags: [SubcontractorManagement]
      operationId: activateSubcontractor
      summary: Fasoncu yeniden etkinleştirir
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasife alınmış kaydı listelere geri getirir. Tekrarı zararsızdır.
      parameters:
        - name: subcontractorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/drivers:
    get:
      tags: [MasterData]
      operationId: listDrivers
      summary: Şoför listesi
      description: |
        Şoför seçimi için; `subcontractorId` verilirse yalnızca o fasoncunun şoförleri gelir. Arama `q` ile ad/unvan/plaka içinde yapılır (büyük-küçük harf duyarsız); sonuçlar kapsama göre süzülür.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/StatusFilter'
        - name: subcontractorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [DriverManagement]
      operationId: createDriver
      summary: Şoför ekler
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Fasoncu verilirse etkin bir fasoncu olmalıdır. Aynı `Idempotency-Key` ile tekrar gönderilen istek yeni kayıt açmaz, ilk yanıtı döner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequest'
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/master-data/drivers/{driverId}:
    put:
      tags: [DriverManagement]
      operationId: updateDriver
      summary: Şoför günceller
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Gönderilen alanlar kaydın yeni halidir; kayıt pasif olsa da güncellenebilir.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequest'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/drivers/{driverId}/deactivate:
    post:
      tags: [DriverManagement]
      operationId: deactivateDriver
      summary: Şoför pasife alır
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasif kayıt listelerde görünmez, eski sevkiyatlar etkilenmez; kayıt silinmez. Tekrarı zararsızdır.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/drivers/{driverId}/activate:
    post:
      tags: [DriverManagement]
      operationId: activateDriver
      summary: Şoför yeniden etkinleştirir
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasife alınmış kaydı listelere geri getirir. Tekrarı zararsızdır.
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/vehicles:
    get:
      tags: [MasterData]
      operationId: listVehicles
      summary: Araç listesi
      description: |
        Araç seçimi için. Arama `q` ile ad/unvan/plaka içinde yapılır (büyük-küçük harf duyarsız); sonuçlar kapsama göre süzülür.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [VehicleManagement]
      operationId: createVehicle
      summary: Araç ekler
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Plaka boşluksuz büyük harfe çevrilir; başka bir araçta kullanılan plaka 409 verir. Aynı `Idempotency-Key` ile tekrar gönderilen istek yeni kayıt açmaz, ilk yanıtı döner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/master-data/vehicles/{vehicleId}:
    put:
      tags: [VehicleManagement]
      operationId: updateVehicle
      summary: Araç günceller
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Gönderilen alanlar kaydın yeni halidir; kayıt pasif olsa da güncellenebilir.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/master-data/vehicles/{vehicleId}/deactivate:
    post:
      tags: [VehicleManagement]
      operationId: deactivateVehicle
      summary: Araç pasife alır
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasif kayıt listelerde görünmez, eski sevkiyatlar etkilenmez; kayıt silinmez. Tekrarı zararsızdır.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/vehicles/{vehicleId}/activate:
    post:
      tags: [VehicleManagement]
      operationId: activateVehicle
      summary: Araç yeniden etkinleştirir
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasife alınmış kaydı listelere geri getirir. Tekrarı zararsızdır.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/sites:
    get:
      tags: [MasterData]
      operationId: listSites
      summary: Lokasyon listesi
      description: |
        Yalnızca kullanıcının yetkili olduğu lokasyonlar gelir (GEN-07). Arama `q` ile ad/unvan/plaka içinde yapılır (büyük-küçük harf duyarsız); sonuçlar kapsama göre süzülür.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [SiteManagement]
      operationId: createSite
      summary: Lokasyon ekler
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Ad boş olamaz. Aynı `Idempotency-Key` ile tekrar gönderilen istek yeni kayıt açmaz, ilk yanıtı döner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/master-data/sites/{siteId}:
    put:
      tags: [SiteManagement]
      operationId: updateSite
      summary: Lokasyon günceller
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Gönderilen alanlar kaydın yeni halidir; kayıt pasif olsa da güncellenebilir.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequest'
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/master-data/sites/{siteId}/deactivate:
    post:
      tags: [SiteManagement]
      operationId: deactivateSite
      summary: Lokasyon pasife alır
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasif kayıt listelerde görünmez, eski sevkiyatlar etkilenmez; kayıt silinmez. Tekrarı zararsızdır.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/master-data/sites/{siteId}/activate:
    post:
      tags: [SiteManagement]
      operationId: activateSite
      summary: Lokasyon yeniden etkinleştirir
      description: |
        Yalnızca yönetici (MASTER_DATA_MANAGE). Pasife alınmış kaydı listelere geri getirir. Tekrarı zararsızdır.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Yapıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/shipments/{shipmentId}/history:
    get:
      tags: [ShipmentFile]
      operationId: getShipmentHistory
      summary: Sevkiyatın durum geçmişi, eskiden yeniye
      description: Kapsamdaki her kullanıcı için aynıdır; kişisel veri taşımaz, işlemi yapan yalnızca kimlikle gelir.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Geçmiş
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/shipments/{shipmentId}/cancel:
    post:
      tags: [ShipmentCancellation]
      operationId: cancelShipment
      summary: Yola çıkmamış sevkiyatı iptal eder
      description: |
        Yalnızca yönetici (SHIPMENT_CANCEL). Taslak (DRAFT) ya da çıkış tartımı yapılmış (LOADED) sevkiyat iptal
        edilir; gerekçe zorunludur. Sevkiyata atanmış çuvallar bag-service'te serbest bırakılır ve yeniden
        kullanılabilir olur. Çuval servisi yanıt vermezse iptal de yapılmaz (`BAG_SERVICE_UNAVAILABLE`) ve istek
        güvenle tekrarlanır. Zaten iptal edilmiş sevkiyata gelen istek başarılı döner. Yola çıkmış sevkiyat
        iptal edilemez (`INVALID_SHIPMENT_STATUS`).
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelShipmentRequest'
      responses:
        '204':
          description: İptal edildi
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/shipments/{shipmentId}/bags:
    post:
      tags: [ShipmentBags]
      operationId: assignShipmentBags
      summary: Çuvalları taslak sevkiyata atar
      description: |
        Depo personeli çuvalları okutur ya da listeden seçer; her çuval bag-service'te bu sevkiyata ayrılır ve
        sevkiyatın çuval listesine yazılır. Yalnızca çıkış tartımından önce (DRAFT) yapılabilir. Hepsi ya da hiçbiri:
        bir çuval bulunamazsa (`BAG_NOT_FOUND`), kullanılamaz durumdaysa (`BAG_NOT_AVAILABLE`) ya da başka
        sevkiyattaysa (`BAG_ALREADY_RESERVED`) hiçbiri atanmaz. Aynı çuvalı tekrar göndermek hata vermez;
        `assignedCount` yalnızca yeni atananları sayar. Çuval servisi yanıt vermezse `BAG_SERVICE_UNAVAILABLE`.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignShipmentBagsRequest'
      responses:
        '200':
          description: Çuvallar atandı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignShipmentBagsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
    get:
      tags: [ShipmentFile]
      operationId: getShipmentBags
      summary: Sevkiyatın çuvalları, isteyenin görünümüyle
      description: |
        Kör giriş (SEC-05): çıkışta atanan çuval listesi (`dispatchBags`) fasoncu ve şoför görünümünde,
        teslimde okutulanlar (`deliveryScans`) depo ve şoför görünümünde hiç yer almaz. Teslim okutmaları teslim
        kaydı gönderildikten sonra oluşur; önce boştur. Listeler sayfalanmaz: bir sevkiyatın çuval sayısıyla sınırlıdır.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Çuvallar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentBagsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/shipments/{shipmentId}/bags/{uniqueKey}:
    delete:
      tags: [ShipmentBags]
      operationId: removeShipmentBag
      summary: Çuvalı taslak sevkiyattan çıkarır
      description: |
        Yanlış okutulan çuvalı sevkiyat listesinden çıkarır ve bag-service'te rezervasyonunu bırakır; çuval başka bir
        sevkiyata atanabilir olur. Yalnızca çıkış tartımından önce (DRAFT) yapılabilir. Çuval sevkiyatta değilse de
        204 döner, böylece istek güvenle tekrarlanır. Çuval servisi yanıt vermezse `BAG_SERVICE_UNAVAILABLE`.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: uniqueKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '204':
          description: Çuval sevkiyattan çıkarıldı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    StatusFilter:
      name: status
      in: query
      required: false
      description: ACTIVE yalnızca etkin kayıtlar (varsayılan); ALL pasifler de gelir (yalnızca MASTER_DATA_MANAGE, yoksa 403)
      schema:
        $ref: '#/components/schemas/MasterDataStatusFilter'
    SearchText:
      name: q
      in: query
      required: false
      description: Arama metni
      schema:
        type: string
        minLength: 1
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: İşlem kaydedildiği anda istemcide üretilir, yeniden denemede aynı kalır (API-04)
      schema:
        type: string
        format: uuid
  responses:
    Conflict:
      description: >-
        Sevkiyatın durumu bu işleme izin vermiyor (INVALID_SHIPMENT_STATUS) ya da çuval kullanılamıyor
        (BAG_NOT_AVAILABLE, BAG_ALREADY_RESERVED) ya da plaka başka araçta kullanılıyor (DUPLICATE_PLATE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: İstek biçimi hatalı
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Oturum yok veya token geçersiz (code AUTHENTICATION_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: İzin yok (ACCESS_DENIED) veya kayıt kapsam dışı (OUT_OF_SCOPE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Çuval servisine ulaşılamadı (code BAG_SERVICE_UNAVAILABLE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Kayıt yok (SHIPMENT_NOT_FOUND, BAG_NOT_FOUND ya da MASTER_DATA_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: RFC 9457 hata gövdesi (ERR-07). Frontend kararını `code` alanına göre verir.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: https://errors.yarnshipment.com/out-of-scope
        title:
          type: string
          example: Erişim dışı kayıt
        status:
          type: integer
          format: int32
          example: 403
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: OUT_OF_SCOPE
        requestId:
          type: string
    Kg:
      description: Üç ondalıklı kilo, dize olarak (API-03)
      type: string
      pattern: '^\d{1,9}\.\d{3}$'
      example: '1982.500'
    Role:
      type: string
      enum: [ADMIN, WAREHOUSE, DRIVER, SUBCONTRACTOR, QUALITY, MANAGER]
    Permission:
      type: string
      enum:
        - MASTER_DATA_VIEW
        - MASTER_DATA_MANAGE
        - USER_MANAGE
        - SETTINGS_MANAGE
        - LOT_QUALITY_LOCK
        - SHIPMENT_VIEW
        - SHIPMENT_CREATE
        - SHIPMENT_CANCEL
        - DISPATCH_RECORD
        - DISPATCH_VIEW
        - DRIVER_DECLARATION_RECORD
        - DRIVER_DECLARATION_VIEW
        - DELIVERY_RECORD
        - DELIVERY_VIEW
        - EVIDENCE_UPLOAD_DISPATCH
        - EVIDENCE_UPLOAD_DRIVER
        - EVIDENCE_UPLOAD_DELIVERY
        - EVIDENCE_UPLOAD_CLAIM
        - EVIDENCE_VIEW
        - EVIDENCE_INVALIDATE
        - CORRECTION_CREATE
        - QUALITY_CLAIM_OPEN
        - DISCREPANCY_VIEW
        - DISCREPANCY_RESOLVE
        - AUDIT_VIEW
        - REPORT_VIEW
    CurrentUserResponse:
      type: object
      required: [userId, fullName, roles, permissions, siteIds, mfaVerified]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        siteIds:
          type: array
          items:
            type: string
            format: uuid
        subcontractorId:
          description: Yalnızca fasoncu kullanıcılarında
          type: string
          format: uuid
        driverId:
          description: Yalnızca şoför kullanıcılarında
          type: string
          format: uuid
        mfaVerified:
          type: boolean
    ShipmentStatus:
      type: string
      enum: [DRAFT, LOADED, IN_TRANSIT, AWAITING_DELIVERY, CHECKING, IN_REVIEW, COMPLETED, CANCELLED]
    ShipmentAction:
      description: Kullanıcının bu sevkiyatta şu an yapabileceği işlem; buton yalnızca listede varsa gösterilir.
      type: string
      enum:
        - ASSIGN_BAGS
        - RECORD_DISPATCH
        - CANCEL
        - CONFIRM_PICKUP
        - DECLARE_ARRIVAL
        - RECORD_DELIVERY
        - OPEN_QUALITY_CLAIM
        - CREATE_CORRECTION
    PageMetadata:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ShipmentPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentSummaryView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    ShipmentSummaryView:
      description: Liste satırı. Kör girişe tabi alan taşımaz, bu yüzden tüm rollerde aynıdır.
      type: object
      required: [shipmentId, shipmentNo, siteId, status, subcontractorId, subcontractorTitle, createdAt, allowedActions]
      properties:
        shipmentId:
          type: string
          format: uuid
        shipmentNo:
          type: string
          example: SV-2026-000123
        siteId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        subcontractorId:
          type: string
          format: uuid
        subcontractorTitle:
          type: string
        driverName:
          type: string
        plateNo:
          type: string
        createdAt:
          type: string
          format: date-time
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentAction'
    Audience:
      description: Görünüm türü; hangi alanların bulunacağını belirler.
      type: string
      enum: [INTERNAL, WAREHOUSE, SUBCONTRACTOR, DRIVER]
    WeighingView:
      type: object
      required: [grossKg, tareKg, netKg, bagCount, weighedAt]
      properties:
        grossKg:
          $ref: '#/components/schemas/Kg'
        tareKg:
          $ref: '#/components/schemas/Kg'
        netKg:
          $ref: '#/components/schemas/Kg'
        bagCount:
          type: integer
          format: int32
        weighedAt:
          type: string
          format: date-time
    SealCondition:
      type: string
      enum: [INTACT, DAMAGED, MISSING]
    ScanMethod:
      description: Çuval anahtarının nasıl girildiği
      type: string
      enum: [SCAN, LIST, MANUAL]
    DeliveryReceiptRequest:
      type: object
      required: [grossKg, tareKg, bagCount, sealCondition, bagUniqueKeys]
      properties:
        grossKg:
          $ref: '#/components/schemas/Kg'
        tareKg:
          $ref: '#/components/schemas/Kg'
        bagCount:
          description: Tartılan çuval sayısı
          type: integer
          format: int32
          minimum: 1
        sealCondition:
          $ref: '#/components/schemas/SealCondition'
        sealNo:
          description: Mühür üzerindeki numara; mühür yoksa (MISSING) boş bırakılır
          type: string
          minLength: 1
          maxLength: 64
        bagUniqueKeys:
          description: Okutulan çuval anahtarları; tekrar edenler bir kez sayılır
          type: array
          maxItems: 2000
          items:
            type: string
            minLength: 1
            maxLength: 64
        scanMethod:
          $ref: '#/components/schemas/ScanMethod'
        document:
          $ref: '#/components/schemas/DeliveryDocument'
    CancelShipmentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AssignShipmentBagsRequest:
      type: object
      required: [uniqueKeys, scanMethod]
      properties:
        uniqueKeys:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        scanMethod:
          $ref: '#/components/schemas/ScanMethod'
    AssignShipmentBagsResponse:
      type: object
      required: [assignedCount]
      properties:
        assignedCount:
          type: integer
          format: int32
          minimum: 0
          description: Bu istekle yeni atanan çuval sayısı
    CreateShipmentRequest:
      type: object
      required: [siteId, subcontractorId, subcontractorTitle]
      properties:
        siteId:
          type: string
          format: uuid
        subcontractorId:
          type: string
          format: uuid
        subcontractorTitle:
          type: string
          minLength: 1
          maxLength: 200
        driverId:
          type: string
          format: uuid
        driverName:
          type: string
          minLength: 1
          maxLength: 200
        vehicleId:
          type: string
          format: uuid
        plateNo:
          type: string
          minLength: 1
          maxLength: 20
    CreateShipmentResponse:
      type: object
      required: [id, shipmentNo]
      properties:
        id:
          type: string
          format: uuid
        shipmentNo:
          type: string
    SubcontractorPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubcontractorView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    MasterDataStatusFilter:
      type: string
      enum: [ACTIVE, ALL]
      default: ACTIVE
    SubcontractorRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    DriverRequest:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        subcontractorId:
          type: string
          format: uuid
          description: Fasonculuk şoförü ise bağlı olduğu etkin fasoncu; kendi şoförü ise boş
    SubcontractorView:
      type: object
      required: [id, title]
      properties:
        active:
          type: boolean
          description: Yalnızca liste yanıtında dolar; pasif kayıt yalnızca status=ALL ile gelir
        id:
          type: string
          format: uuid
        title:
          type: string
    DriverPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    DriverView:
      type: object
      required: [id, fullName]
      properties:
        active:
          type: boolean
          description: Yalnızca liste yanıtında dolar; pasif kayıt yalnızca status=ALL ile gelir
        id:
          type: string
          format: uuid
        fullName:
          type: string
        subcontractorId:
          type: string
          format: uuid
        subcontractorTitle:
          type: string
          description: Bağlı fasoncunun unvanı; yalnızca liste yanıtında dolar
    VehiclePageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VehicleView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    VehicleRequest:
      type: object
      required: [plateNo]
      properties:
        plateNo:
          type: string
          minLength: 1
          maxLength: 20
    SiteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    VehicleView:
      type: object
      required: [id, plateNo]
      properties:
        active:
          type: boolean
          description: Yalnızca liste yanıtında dolar; pasif kayıt yalnızca status=ALL ile gelir
        id:
          type: string
          format: uuid
        plateNo:
          type: string
    SitePageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    SiteView:
      type: object
      required: [id, name]
      properties:
        active:
          type: boolean
          description: Yalnızca liste yanıtında dolar; pasif kayıt yalnızca status=ALL ile gelir
        id:
          type: string
          format: uuid
        name:
          type: string
