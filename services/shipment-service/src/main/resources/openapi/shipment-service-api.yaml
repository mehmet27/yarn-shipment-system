          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    StatusFilter:
      name: status
      in: query
      required: false
      description: ACTIVE yalnızca etkin kayıtlar (varsayılan); ALL pasifler de gelir (yalnızca MASTER_DATA_MANAGE, yoksa 403)
      schema:
        $ref: '#/components/schemas/MasterDataStatusFilter'
    SearchText:
      name: q
      in: query
      required: false
      description: Arama metni
      schema:
        type: string
        minLength: 1
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: İşlem kaydedildiği anda istemcide üretilir, yeniden denemede aynı kalır (API-04)
      schema:
        type: string
        format: uuid
  responses:
    Conflict:
      description: >-
        Sevkiyatın durumu bu işleme izin vermiyor (INVALID_SHIPMENT_STATUS) ya da çuval kullanılamıyor
        (BAG_NOT_AVAILABLE, BAG_ALREADY_RESERVED) ya da plaka başka araçta kullanılıyor (DUPLICATE_PLATE) ya da
        fasoncu ünvanı kullanılmış (DUPLICATE_SUBCONTRACTOR) ya da kod / parti numarası kullanılmış (DUPLICATE_CODE)
        ya da partinin kalitesi kilitli (LOT_QUALITY_LOCKED) ya da düzeltilecek kayıt bu arada
        değişti (CORRECTION_CONFLICT)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: İstek biçimi hatalı; plaka biçimi geçersizse `INVALID_PLATE`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Oturum yok veya token geçersiz (code AUTHENTICATION_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: İzin yok (ACCESS_DENIED), kayıt kapsam dışı (OUT_OF_SCOPE) ya da çuval başka lokasyonda (BAG_OUT_OF_SCOPE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: >-
        Çuval servisine (BAG_SERVICE_UNAVAILABLE), kanıt servisine (EVIDENCE_SERVICE_UNAVAILABLE) ya da Keycloak'a
        (LOGIN_ACCOUNT_UNAVAILABLE) ulaşılamadı
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Kayıt yok (SHIPMENT_NOT_FOUND, BAG_NOT_FOUND ya da MASTER_DATA_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: RFC 9457 hata gövdesi (ERR-07). Frontend kararını `code` alanına göre verir.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: https://errors.yarnshipment.com/out-of-scope
        title:
          type: string
          example: Erişim dışı kayıt
        status:
          type: integer
          format: int32
          example: 403
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: OUT_OF_SCOPE
        requestId:
          type: string
    Kg:
      description: Üç ondalıklı kilo, dize olarak (API-03)
      type: string
      pattern: '^\d{1,9}\.\d{3}$'
      example: '1982.500'
    Role:
      type: string
      enum: [ADMIN, WAREHOUSE, QUALITY, MANAGER, GENERAL_MANAGER]
    Permission:
      type: string
      enum:
        - MASTER_DATA_VIEW
        - MASTER_DATA_MANAGE
        - USER_MANAGE
        - SETTINGS_MANAGE
        - LOT_QUALITY_LOCK
        - BAG_CREATE
        - SHIPMENT_VIEW
        - SHIPMENT_CREATE
        - SHIPMENT_CANCEL
        - SHIPMENT_COMPLETE
        - DISPATCH_RECORD
        - DISPATCH_VIEW
        - EVIDENCE_UPLOAD_DISPATCH
        - EVIDENCE_UPLOAD_CLAIM
        - EVIDENCE_VIEW
        - EVIDENCE_INVALIDATE
        - CORRECTION_CREATE
        - QUALITY_CLAIM_OPEN
        - DISCREPANCY_VIEW
        - DISCREPANCY_RESOLVE
        - AUDIT_VIEW
        - REPORT_VIEW
        - FABRIC_RECEIPT_RECORD
        - YARN_RETURN_RECORD
        - FIRE_RATE_EDIT
        - INVOICE_MARK
        - BALANCE_VIEW
        - WEIGHT_MISMATCH_RESOLVE
    CurrentUserResponse:
      type: object
      required: [userId, fullName, roles, permissions, siteIds, mfaVerified]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        siteIds:
          type: array
          items:
            type: string
            format: uuid
        mfaVerified:
          type: boolean
    ShipmentStatus:
      type: string
      enum: [DRAFT, WEIGHT_MISMATCH, AWAITING_DELIVERY, COMPLETED, CANCELLED]
    ShipmentAction:
      description: Kullanıcının bu sevkiyatta şu an yapabileceği işlem; buton yalnızca listede varsa gösterilir.
      type: string
      enum:
        - ASSIGN_BAGS
        - RECORD_DISPATCH
        - CANCEL
        - RESOLVE_WEIGHT_MISMATCH
        - COMPLETE
        - OPEN_QUALITY_CLAIM
        - CREATE_CORRECTION
    PageMetadata:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ShipmentPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentSummaryView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    ShipmentSummaryView:
      description: Liste satırı; tüm rollerde aynıdır.
      type: object
      required: [shipmentId, shipmentNo, siteId, status, subcontractorId, subcontractorTitle, createdAt, allowedActions]
      properties:
        shipmentId:
          type: string
          format: uuid
        shipmentNo:
          type: string
          example: SV-2026-000123
        siteId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        subcontractorId:
          type: string
          format: uuid
        subcontractorTitle:
          type: string
        driverName:
          type: string
        plateNo:
          type: string
        createdAt:
          type: string
          format: date-time
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentAction'
    Audience:
      description: Görünüm türü; hangi alanların bulunacağını belirler.
      type: string
      enum: [INTERNAL, WAREHOUSE]
    WeighingView:
      type: object
      required: [grossKg, tareKg, netKg, bagCount, weighedAt]
      properties:
        grossKg:
          $ref: '#/components/schemas/Kg'
        tareKg:
          $ref: '#/components/schemas/Kg'
        netKg:
          $ref: '#/components/schemas/Kg'
        bagCount:
          type: integer
          format: int32
        weighedAt:
          type: string
          format: date-time
        expectedTareKg:
          $ref: '#/components/schemas/Kg'
        tareTolerancePct:
          $ref: '#/components/schemas/Pct'
        tareDeviationPct:
          $ref: '#/components/schemas/Pct'
        tareAlert:
          type: boolean
          description: Dara, kayıt anındaki standarttan izin verilenden fazla saptı. Standart tanımsızsa false ve sapma alanları yok
    CorrectionTarget:
      description: |
        Düzeltilen kayıt: çıkış tartımı (brüt ve dara)
      type: string
      enum: [DISPATCH_WEIGHING]
    RecordCorrectionRequest:
      description: Brüt ve dara tartım düzeltmesinde zorunludur; eksikse 400 INVALID_CORRECTION döner.
      type: object
      required: [target, reason]
      properties:
        target:
          $ref: '#/components/schemas/CorrectionTarget'
        grossKg:
          $ref: '#/components/schemas/Kg'
        tareKg:
          $ref: '#/components/schemas/Kg'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    CorrectionView:
      description: |
        Bir düzeltme. Değerler `gross=… tare=… net=…` biçimindedir (kilo, üç ondalık).
      type: object
      required: [id, target, reason, status, requestedBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        target:
          $ref: '#/components/schemas/CorrectionTarget'
        oldValue:
          type: string
        newValue:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        requestedBy:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    CorrectionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CorrectionView'
    CompleteShipmentRequest:
      type: object
      required: [waybillNo, waybillEvidenceId]
      properties:
        waybillNo:
          description: Müdüre ulaşan irsaliyenin numarası
          type: string
          minLength: 1
          maxLength: 64
        waybillEvidenceId:
          description: evidence-service'e WAYBILL türüyle yüklenen irsaliye belgesinin kimliği
          type: string
          format: uuid
    CancelShipmentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AssignShipmentBagsRequest:
      type: object
      required: [weightsKg]
      properties:
        weightsKg:
          description: Eklenecek çuvalların kiloları; her kilo bir çuvaldır, girilme sırasıyla numaralanır
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Kg'
    AssignShipmentBagsResponse:
      type: object
      required: [assignedCount]
      properties:
        assignedCount:
          type: integer
          format: int32
          minimum: 0
          description: Bu istekle eklenen çuval sayısı
    CreateShipmentRequest:
      type: object
      required: [siteId, subcontractorId, subcontractorTitle, lines]
      properties:
        lines:
          description: Reçete satırları (en az bir); beklenen net kilo satırların toplamıdır
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RecipeLineInput'
        fireRate:
          $ref: '#/components/schemas/FireRate'
        siteId:
          type: string
          format: uuid
        subcontractorId:
          type: string
          format: uuid
        subcontractorTitle:
          type: string
          minLength: 1
          maxLength: 200
        driverId:
          type: string
          format: uuid
        driverName:
          type: string
          minLength: 1
          maxLength: 200
        vehicleId:
          type: string
          format: uuid
        plateNo:
          type: string
          minLength: 1
          maxLength: 20
    FireRate:
      description: Fire oranı, ondalık dize, 0–0.20 (ör. "0.0400" = %4). Oluşturmada verilmezse ayardaki varsayılan kullanılır
      type: string
      pattern: '^0\.\d{1,4}$|^[01]$'
      example: '0.0400'
    RecipeLineInput:
      type: object
      required: [netKg]
      description: En az biri verilir, yarnTypeId ya da yarnTypeText
      properties:
        yarnTypeId:
          type: string
          format: uuid
        yarnTypeText:
          type: string
          minLength: 1
          maxLength: 200
        lotId:
          type: string
          format: uuid
        netKg:
          $ref: '#/components/schemas/Kg'
        fabricType:
          type: string
          maxLength: 200
          description: Sipariş formu, kumaş cinsi
        lycra:
          type: string
          maxLength: 200
          description: Sipariş formu, LYC (ör. 30 denye)
        widthType:
          type: string
          pattern: '^(TUBE|MAY|OPEN_WIDTH)$'
          description: Sipariş formu, tüp / may / açık en
        yarnLength:
          type: string
          maxLength: 200
          description: Sipariş formu, iplik uzunluğu / lycra
        pussFine:
          type: string
          maxLength: 200
          description: Sipariş formu, puss-fine
        unitPrice:
          type: string
          pattern: '^\d{1,8}(\.\d{1,4})?$'
          description: Sipariş formu, birim fiyat (TL/kg)
    RecipeLineView:
      type: object
      required: [lineNo, netKg]
      properties:
        lineNo:
          type: integer
          format: int32
        yarnTypeId:
          type: string
          format: uuid
        yarnTypeText:
          type: string
        lotId:
          type: string
          format: uuid
        netKg:
          $ref: '#/components/schemas/Kg'
        fabricType:
          type: string
          maxLength: 200
          description: Sipariş formu, kumaş cinsi
        lycra:
          type: string
          maxLength: 200
          description: Sipariş formu, LYC (ör. 30 denye)
        widthType:
          type: string
          pattern: '^(TUBE|MAY|OPEN_WIDTH)$'
          description: Sipariş formu, tüp / may / açık en
        yarnLength:
          type: string
          maxLength: 200
          description: Sipariş formu, iplik uzunluğu / lycra
        pussFine:
          type: string
          maxLength: 200
          description: Sipariş formu, puss-fine
        unitPrice:
          type: string
          pattern: '^\d{1,8}(\.\d{1,4})?$'
          description: Sipariş formu, birim fiyat (TL/kg)
    WeightCheckView:
      type: object
      required: [expectedKg, measuredKg, diffKg]
      properties:
        expectedKg:
          $ref: '#/components/schemas/Kg'
        measuredKg:
          $ref: '#/components/schemas/Kg'
        diffKg:
          description: Tartılan - beklenen; eksik yükte negatif
          type: string
          pattern: '^-?\d{1,9}\.\d{3}$'
        shortfallReason:
          type: string
    WeightDecisionKind:
      type: string
      enum: [CANCEL, ADD_REMOVE_BAGS, UPDATE_RECIPE]
    WeightDecisionRequest:
      type: object
      required: [decision, reason]
      properties:
        decision:
          $ref: '#/components/schemas/WeightDecisionKind'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ShipmentSettingsView:
      type: object
      required: [defaultFireRate, weightToleranceKg]
      properties:
        defaultFireRate:
          $ref: '#/components/schemas/FireRate'
        weightToleranceKg:
          $ref: '#/components/schemas/Kg'
    ShipmentSettingsRequest:
      type: object
      required: [defaultFireRate, weightToleranceKg]
      properties:
        defaultFireRate:
          $ref: '#/components/schemas/FireRate'
        weightToleranceKg:
          $ref: '#/components/schemas/Kg'
    CreateShipmentResponse:
      type: object
      required: [id, shipmentNo]
      properties:
        id:
          type: string
          format: uuid
        shipmentNo:
          type: string
    SubcontractorPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubcontractorView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    MasterDataStatusFilter:
      type: string
      enum: [ACTIVE, ALL]
      default: ACTIVE
    SubcontractorRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    DriverRequest:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        subcontractorId:
          type: string
          format: uuid
          description: Fasonculuk şoförü ise bağlı olduğu etkin fasoncu; kendi şoförü ise boş
    SubcontractorView:
      type: object
      required: [id, title]
      properties:
        active:
          type: boolean
          description: Yalnızca liste yanıtında dolar; pasif kayıt yalnızca status=ALL ile gelir
        id:
          type: string
          format: uuid
        title:
          type: string
    DriverPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    DriverView:
      type: object
      required: [id, fullName]
      properties:
        active:
          type: boolean
          description: Yalnızca liste yanıtında dolar; pasif kayıt yalnızca status=ALL ile gelir
        id:
          type: string
          format: uuid
        fullName:
          type: string
        subcontractorId:
          type: string
          format: uuid
        subcontractorTitle:
          type: string
          description: Bağlı fasoncunun unvanı; yalnızca liste yanıtında dolar

    LoginAccountView:
      type: object
      description: Giriş hesabının özeti; şifre ya da kimlik bilgisi içermez.
      required: [id, username, roles, enabled, passwordChangeRequired]
      properties:
        id:
          type: string
          description: Keycloak kullanıcı kimliği
        username:
          type: string
          description: Giriş adı
        fullName:
          type: string
          description: Ad soyad ya da unvan; profilde yoksa gelmez
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
          description: Hesap girişe açık mı
        passwordChangeRequired:
          type: boolean
          description: Kişi geçici şifreyle açıldı, henüz kendi şifresini belirlemedi
        createdAt:
          type: string
          format: date-time
    StaffRole:
      type: string
      description: Yönetici tarafından açılabilen fabrika içi roller; şoför ve fasoncu kayıtlarından açılır
      enum: [ADMIN, WAREHOUSE, QUALITY, MANAGER, GENERAL_MANAGER]
    StaffLoginAccountRequest:
      type: object
      required: [username, fullName, role, password]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
          description: Giriş adı; küçük harf, rakam, nokta, alt çizgi ve tire
        fullName:
          type: string
          minLength: 2
          maxLength: 200
        role:
          $ref: '#/components/schemas/StaffRole'
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: Yöneticinin belirlediği geçici şifre; kişi ilk girişte değiştirir. SMS ya da e-posta doğrulaması yoktur.
    ChangeLoginAccountEnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    SetLoginAccountPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    ChangeLoginAccountRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/StaffRole'
    UserNameListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserNameView'
    UserNameView:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Ad soyad; profilde yoksa giriş adı
    LoginAccountPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoginAccountView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    VehiclePageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VehicleView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    VehicleRequest:
      type: object
      required: [plateNo]
      properties:
        plateNo:
          type: string
          minLength: 1
          maxLength: 20
    SiteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    VehicleView:
      type: object
      required: [id, plateNo]
      properties:
        active:
          type: boolean
          description: Yalnızca liste yanıtında dolar; pasif kayıt yalnızca status=ALL ile gelir
        id:
          type: string
          format: uuid
        plateNo:
          type: string
    SitePageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    SiteView:
      type: object
      required: [id, name]
      properties:
        active:
          type: boolean
          description: Yalnızca liste yanıtında dolar; pasif kayıt yalnızca status=ALL ile gelir
        id:
          type: string
          format: uuid
        name:
          type: string
    ProductCreateRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          description: Harf veya rakamla başlar; harf, rakam ve + . _ / - içerir. Büyük harfe çevrilir, sonra değişmez
        name:
          type: string
          minLength: 1
          maxLength: 200
        yarnCount:
          type: string
          maxLength: 50
          description: İplik numarası, ör. Ne 30/1
    ProductUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        yarnCount:
          type: string
          maxLength: 50
    ProductView:
      type: object
      required: [id, code, name]
      properties:
        active:
          type: boolean
          description: Yalnızca liste yanıtında dolar; pasif kayıt yalnızca status=ALL ile gelir
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        yarnCount:
          type: string
    ProductPageResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductView'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PackagingType:
      type: string
      enum: [BAG]
    Pct:
      description: İki ondalıklı yüzde, dize olarak (API-03); sapmada işaretli olabilir
