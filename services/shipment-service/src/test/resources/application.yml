# shipment modülünün dilim testleri için ayarlar; üretim ayarı yarnshipment-app içindedir.
# Her modül yalnız kendi şemasına bağlanır (search_path tek şema), tablolar şemasız adlarla erişilir.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yarnshipment}
    username: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    hikari:
      schema: shipment
  flyway:
    user: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    default-schema: shipment
    schemas: shipment
    create-schemas: true
    placeholders:
      app_role: ${DB_USER:yarnshipment}
      readonly_role: ${DB_USER:yarnshipment}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  messages:
    basename: shipment-messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
yarnshipment:
  security:
    # Testler oturum çerezi yerine doğrudan kimlik verir; CSRF yalnızca common-security testlerinde denenir.
    csrf-enabled: false
    public-paths:
    - /actuator/health/**
    - /actuator/info
    - /api/v1/branding
    - /api/v1/auth/login
  events:
    routes:
      - type-prefix: com.yarnshipment.shipment.
        topic: shipment.events.v1
        source: /yarn-shipment/shipment-service
      - type-prefix: com.yarnshipment.masterdata.
        topic: shipment.events.v1
        source: /yarn-shipment/shipment-service
      - type-prefix: com.yarnshipment.stock.
        topic: stock.events.v1
        source: /yarn-shipment/shipment-service
