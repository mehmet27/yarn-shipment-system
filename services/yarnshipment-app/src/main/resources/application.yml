# CONF-01: ortamdan gelen değerler ortam değişkeniyle verilir; gizli bilgi bu dosyaya yazılmaz (SEC-14).
# Tek uygulama: beş modülün (shipment, discrepancy, evidence, reporting, audit) ayarları burada birleşir.
spring:
  application:
    name: yarnshipment-app
  datasource:
    # Tek veritabanı, tek kullanıcı, tek bağlantı havuzu. Modül tabloları kendi şemasında durur ve şemasız adlarla
    # erişilir; search_path sırası önemlidir (idempotency_record gibi iki şemada bulunan adlar ilk şemadan okunur).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yarnshipment}
    username: ${DB_USER:yarnshipment}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-init-sql: SET search_path TO shipment, discrepancy, evidence, audit, reporting, public
  # Şema göçü DatabaseMigrationConfiguration'dadır (her şema kendi Flyway'i ve geçmişiyle).
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # JPA varlıkları yalnız shipment şemasındadır.
        default_schema: shipment
        jdbc:
          time_zone: UTC
  messages:
    # Modül başına bir paket; aynı anahtar birden çok pakette varsa soldaki kazanır.
    basename: shipment-messages,discrepancy-messages,evidence-messages,reporting-messages,audit-messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    # API-03 ve SEC-05: henüz girilmemiş değerler JSON'da yer almaz.
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/yarnshipment}
          audiences: yarnshipment-api
server:
  port: ${SERVER_PORT:8083}
yarnshipment:
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info
      # Giriş sayfası da marka rengini okur; yazma ucu yöntem güvenliğiyle (SETTINGS_MANAGE) korunur.
      - /api/v1/branding
  events:
    # Modüller arası olaylar süreç içi iletilir (Kafka yok). Konu ve kaynak olay türünün önekinden gelir; denetim
    # kaydı bunlardan varlık türünü ve servis adını çıkarır (kaynak adları geçmiş kayıtlarla aynı kalır).
    routes:
      - type-prefix: com.yarnshipment.shipment.
        topic: shipment.events.v1
        source: /yarn-shipment/shipment-service
      - type-prefix: com.yarnshipment.masterdata.
        topic: shipment.events.v1
        source: /yarn-shipment/shipment-service
      - type-prefix: com.yarnshipment.evidence.
        topic: evidence.events.v1
        source: /yarn-shipment/evidence-service
      - type-prefix: com.yarnshipment.discrepancy.
        topic: discrepancy.events.v1
        source: /yarn-shipment/discrepancy-service
  database:
    # Yalnızca local profilinde açılır: yerel örnek veri (R__ migration'ları) yüklenir.
    seed-local: false
  evidence:
    storage:
      # S3 uyumlu nesne deposu (yerelde MinIO). Yükleme adresi telefonun erişebildiği adrestir.
      endpoint: ${EVIDENCE_STORAGE_ENDPOINT:http://localhost:9000}
      region: ${EVIDENCE_STORAGE_REGION:us-east-1}
      bucket: ${EVIDENCE_STORAGE_BUCKET:evidence}
      access-key: ${EVIDENCE_STORAGE_ACCESS_KEY}
      secret-key: ${EVIDENCE_STORAGE_SECRET_KEY}
      path-style: true
      upload-url-ttl: 10m
      download-url-ttl: 5m
  audit:
    chain-verification:
      cron: ${AUDIT_CHAIN_VERIFICATION_CRON:0 0 3 * * *}
